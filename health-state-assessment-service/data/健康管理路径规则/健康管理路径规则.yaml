        - examination_id: "EXAM_LIVER_FUNCTION"
          examination_name: "肝功能"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
        
        - examination_id: "EXAM_ECG"
          examination_name: "心电图"
          frequency: "每2年一次"
