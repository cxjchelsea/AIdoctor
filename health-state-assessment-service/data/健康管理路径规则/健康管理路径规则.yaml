      不建议筛查: []
    
    # 36-50岁男性
    - age_range: [36, 50]
      gender: "男性"
      推荐筛查:
        - examination_id: "EXAM_BLOOD_ROUTINE"
          examination_name: "血常规"
          frequency: "每年一次"
          frequency_detail: "每年"
