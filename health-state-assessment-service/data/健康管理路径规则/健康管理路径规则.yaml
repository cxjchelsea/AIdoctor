          examination_name: "肝功能"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
        
        - examination_id: "EXAM_ECG"
          examination_name: "心电图"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "用于筛查心血管疾病"
        
        - examination_id: "EXAM_PSA"
          examination_name: "前列腺特异性抗原"
          frequency: "每2年一次"
          frequency_detail: "每2年"
          priority: "中"
          说明: "用于筛查前列腺疾病"
      
      不建议筛查: []
  
  # 按既往史推荐
  按既往史推荐:
    # 高血压史
    - condition: "既往史_高血压"
      推荐筛查:
        - examination_id: "EXAM_ECG"
          examination_name: "心电图"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "高血压患者需定期检查心电图"
        
        - examination_id: "EXAM_ECHOCARDIOGRAM"
          examination_name: "心脏彩超"
          frequency: "每2年一次"
          frequency_detail: "每2年"
          priority: "高"
          说明: "高血压患者需定期检查心脏结构"
        
        - examination_id: "EXAM_KIDNEY_FUNCTION"
          examination_name: "肾功能"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "高血压可能影响肾功能"
    
    # 糖尿病史
    - condition: "既往史_糖尿病"
      推荐筛查:
        - examination_id: "EXAM_HBA1C"
          examination_name: "糖化血红蛋白"
          frequency: "每3个月一次"
          frequency_detail: "每3个月"
          priority: "高"
          说明: "糖尿病患者需定期监测血糖控制情况"
        
        - examination_id: "EXAM_KIDNEY_FUNCTION"
          examination_name: "肾功能"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "糖尿病可能影响肾功能"
        
        - examination_id: "EXAM_EYE_FUNDUS"
          examination_name: "眼底检查"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "糖尿病可能影响眼底"
  
  # 按家族史推荐
  按家族史推荐:
    # 家族心血管疾病史
    - condition: "家族史_心血管疾病"
      推荐筛查:
        - examination_id: "EXAM_ECG"
          examination_name: "心电图"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "家族心血管疾病史，建议定期检查"
        
        - examination_id: "EXAM_LIPID"
          examination_name: "血脂"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "家族心血管疾病史，建议定期检查血脂"
    
    # 家族肿瘤史
    - condition: "家族史_肿瘤"
      推荐筛查:
        - examination_id: "EXAM_TUMOR_MARKERS"
          examination_name: "肿瘤标志物"
          frequency: "每年一次"
          frequency_detail: "每年"
          priority: "高"
          说明: "家族肿瘤史，建议定期检查肿瘤标志物"

# ============================================
# A4 统一结果页模板库
# ============================================
# 定义各种结果页的输出模板
统一结果页模板库:
  # 筛查建议结果页
  筛查建议结果页:
    template_id: "RESULT_SCREENING"
    template_name: "筛查建议结果页"
    # 一句话总结
    一句话总结:
      template: "根据您的情况，建议{筛查项目频率说明}"
      variables:
        - "筛查项目频率说明"
      example: "根据您的情况，建议每年做一次血常规和肝功能检查，每2年做一次乳腺彩超检查"
    
    # 现在建议做的事
    现在建议做的事:
      template: "现在建议做的事："
      items:
        - template: "预约{检查项目}检查"
          variables:
            - "检查项目"
          priority: "高"
        - template: "预约{检查项目}检查（如未做过）"
          variables:
            - "检查项目"
          priority: "中"
        - template: "保持健康的生活方式"
          priority: "低"
    
    # 暂时不建议做的事
    暂时不建议做的事:
      template: "暂时不建议做的事："
      items:
        - template: "不需要做{检查项目}（{原因}）"
          variables:
            - "检查项目"
            - "原因"
    
    # 下一次复查/更新时间点
    下一次复查时间点:
      template: "{时间}后复查{检查项目}"
      variables:
        - "时间"
        - "检查项目"
      example: "1年后复查血常规和肝功能"
    
    # 退出A路径条件提示
    退出A路径条件提示:
      template: "如果出现不适症状或检查异常，请及时就医"
      fixed: true
  
  # 健康咨询结果页
  健康咨询结果页:
    template_id: "RESULT_CONSULTATION"
    template_name: "健康咨询结果页"
    一句话总结:
      template: "根据您的情况，{健康建议总结}"
      variables:
        - "健康建议总结"
    
    现在建议做的事:
      template: "现在建议做的事："
      items:
        - template: "{健康建议项}"
          variables:
            - "健康建议项"
    
    健康知识:
      template: "相关健康知识："
      items:
        - template: "{健康知识点}"
          variables:
            - "健康知识点"
  
  # 健康风险评估结果页
  健康风险评估结果页:
    template_id: "RESULT_RISK_ASSESSMENT"
    template_name: "健康风险评估结果页"
    一句话总结:
      template: "根据您的情况，您的{风险类型}风险为{风险等级}"
      variables:
        - "风险类型"
        - "风险等级"
    
    风险评估结果:
      template: "风险评估结果："
      items:
        - template: "{风险类型}：{风险等级}（{风险说明}）"
          variables:
            - "风险类型"
            - "风险等级"
            - "风险说明"
    
    风险控制建议:
      template: "风险控制建议："
      items:
        - template: "{风险控制建议项}"
          variables:
            - "风险控制建议项"

# ============================================
# A5 随访节奏规则
# ============================================
# 定义各种随访的节奏和提醒话术
随访节奏规则:
  # 筛查建议随访
  筛查建议随访:
    followup_type: "筛查建议"
    # 随访时间
    随访时间:
      default: "1年后"
      calculation: "根据推荐筛查项目的最短复查周期计算"
      min_interval: "3个月"
      max_interval: "3年"
    # 随访目的
    随访目的: "提醒用户复查筛查项目"
    # 随访提醒话术
    随访提醒话术:
      template: "您上次咨询的体检建议，现在应该复查了"
      variables: []
    # 随访内容
    随访内容:
      - "提醒复查筛查项目"
      - "询问是否有新症状"
      - "询问检查结果"
  
  # 健康咨询随访
  健康咨询随访:
    followup_type: "健康咨询"
    随访时间:
      default: "3个月后"
      calculation: "根据健康建议的执行周期计算"
    # 随访目的
    随访目的: "跟进健康建议的执行情况"
    # 随访提醒话术
    随访提醒话术:
      template: "您上次咨询的健康建议，现在执行得怎么样？"
      variables: []
    # 随访内容
    随访内容:
      - "询问健康建议执行情况"
      - "提供进一步建议"
  
  # 健康风险评估随访
  健康风险评估随访:
    followup_type: "健康风险评估"
    随访时间:
      default: "6个月后"
      calculation: "根据风险等级调整，高风险缩短随访周期"
      risk_adjustment:
        高风险: "3个月"
        中风险: "6个月"
        低风险: "1年"
    # 随访目的
    随访目的: "重新评估健康风险"
    # 随访提醒话术
    随访提醒话术:
      template: "您上次的健康风险评估，现在应该重新评估了"
      variables: []
    # 随访内容
    随访内容:
      - "重新评估健康风险"
      - "更新健康档案"
      - "调整筛查建议"

# ============================================
# 依赖项
# ============================================
依赖项:
  标准目录主数据:
    说明: "检验项目目录，从知识图谱查询"
    来源: "知识图谱_标准目录主数据（3）"
    用途: "用于筛查建议规则库中的检查项目信息"
  
  基础标准配置:
    说明: "人群字段标准等基础配置"
    来源: "基础标准配置（2）"
    用途: "用于健康档案字段清单的字段定义"
  
  输出规则:
    说明: "结果页结构定义"
    来源: "输出规则（13）"
    用途: "用于统一结果页模板库的结构定义"
  
  收效与升级规则:
    说明: "复评时间窗设置"
    来源: "收效与升级规则（11）"
    用途: "用于随访节奏规则的复评时间窗设置"

