# ============================================
# 已诊断疾病咨询 → 可能主诉映射表
# ============================================
# 将已诊断疾病咨询转换为可能的主诉，用于生成问诊问题
已诊断疾病转换规则:
  # 已诊断疾病咨询（通用规则）
  已诊断疾病_通用:
    rule_id: "CONV_DIAGNOSED_DISEASE"
    entry_type: "已诊断疾病"
    entry_value: "通用"
    entry_description: "用户咨询已诊断疾病的相关问题"
    # 转换策略：根据已诊断疾病，转换为相关主诉
    转换策略:
      - "识别已诊断疾病名称"
      - "查询疾病相关症状"
      - "转换为可能主诉"
      - "生成问诊问题"
    # 示例：已诊断高血压
    示例_高血压:
      已诊断疾病: "高血压"
      可能主诉:
        - chief_complaint_id: "CC_HEADACHE"
          chief_complaint_name: "头痛"
          conversion_reason: "高血压患者咨询头痛，需关注血压控制情况"
        - chief_complaint_id: "CC_DIZZINESS"
          chief_complaint_name: "头晕"
          conversion_reason: "高血压患者咨询头晕，需关注血压控制情况"
      转换路径: "B"
    转换说明: "已诊断疾病咨询，建议进入症状诊断路径，关注疾病相关症状和并发症"

# ============================================
# 追问策略库
# ============================================
# 针对不同入口类型的标准追问问题模板
追问策略库:
  # 家族史入口追问策略
  家族史入口追问策略:
    strategy_id: "QUEST_FAMILY_HISTORY"
    entry_type: "家族史"
    # 标准追问问题模板
    追问问题:
      # 问题1：确认家族史详情
      - question_id: "Q_FAMILY_001"
        question_content: "您家族中具体是哪位亲属有{疾病名称}？"
        question_type: "确认详情"
        priority: 1
        answer_format:
          type: "选择"
          options:
            - "父亲"
            - "母亲"
            - "兄弟姐妹"
            - "祖父母"
            - "其他"
        next_action: "根据亲属关系评估风险"
      
      # 问题2：确认发病年龄
      - question_id: "Q_FAMILY_002"
        question_content: "您家族中{疾病名称}的发病年龄大概是多少？"
        question_type: "评估风险"
        priority: 2
        answer_format:
          type: "数值"
          unit: "岁"
        next_action: "根据发病年龄评估风险等级"
      
      # 问题3：询问相关症状
      - question_id: "Q_FAMILY_003"
        question_content: "您自己现在有没有{相关症状}？"
        question_type: "症状筛查"
        priority: 3
        answer_format:
          type: "布尔"
          options:
            - "有"
            - "没有"
            - "不确定"
        next_action: "如有症状，进入症状诊断路径"
    
    # 追问流程
    追问流程:
      - step: 1
        question: "Q_FAMILY_001"
        purpose: "确认家族史详情"
      - step: 2
        question: "Q_FAMILY_002"
        purpose: "评估风险等级"
      - step: 3
        question: "Q_FAMILY_003"
        purpose: "症状筛查"
        condition: "根据家族史类型选择相关症状"
  
  # 既往史入口追问策略
  既往史入口追问策略:
    strategy_id: "QUEST_PAST_HISTORY"
    entry_type: "既往疾病"
    # 标准追问问题模板
    追问问题:
      # 问题1：确认疾病诊断时间
      - question_id: "Q_PAST_001"
        question_content: "您{疾病名称}是什么时候诊断的？"
        question_type: "确认详情"
        priority: 1
        answer_format:
          type: "时间"
          format: "YYYY-MM"
        next_action: "了解疾病病程"
      
      # 问题2：询问治疗情况
      - question_id: "Q_PAST_002"
        question_content: "您目前{疾病名称}的治疗情况如何？是否规律服药？"
        question_type: "评估控制情况"
        priority: 2
        answer_format:
          type: "复合"
          options:
            - "规律服药，控制良好"
            - "规律服药，控制一般"
            - "不规律服药"
            - "未服药"
        next_action: "评估疾病控制情况"
      
      # 问题3：询问相关症状
      - question_id: "Q_PAST_003"
        question_content: "您最近有没有{相关症状}？"
        question_type: "症状筛查"
        priority: 3
        answer_format:
          type: "布尔"
          options:
            - "有"
            - "没有"
            - "不确定"
        next_action: "如有症状，进入症状诊断路径"
    
    # 追问流程
    追问流程:
      - step: 1
        question: "Q_PAST_001"
        purpose: "确认疾病诊断时间"
      - step: 2
        question: "Q_PAST_002"
        purpose: "评估疾病控制情况"
      - step: 3
        question: "Q_PAST_003"
        purpose: "症状筛查"
        condition: "根据既往疾病类型选择相关症状"
  
  # 体检异常入口追问策略
  体检异常入口追问策略:
    strategy_id: "QUEST_EXAM_ABNORMAL"
    entry_type: "异常指标"
    # 标准追问问题模板
    追问问题:
      # 问题1：确认异常指标详情
      - question_id: "Q_EXAM_001"
        question_content: "您体检报告中{指标名称}的具体数值是多少？"
        question_type: "确认详情"
        priority: 1
        answer_format:
          type: "数值"
          unit: "根据指标类型"
        next_action: "评估异常程度"
      
      # 问题2：询问检查时间
      - question_id: "Q_EXAM_002"
        question_content: "您是什么时候做的这个检查？"
        question_type: "确认时间"
        priority: 2
        answer_format:
          type: "时间"
          format: "YYYY-MM-DD"
        next_action: "了解检查时间"
      
      # 问题3：询问相关症状
      - question_id: "Q_EXAM_003"
        question_content: "您最近有没有{相关症状}？"
        question_type: "症状筛查"
        priority: 3
        answer_format:
          type: "布尔"
          options:
            - "有"
            - "没有"
            - "不确定"
        next_action: "如有症状，进入症状诊断路径"
      
      # 问题4：询问既往史
      - question_id: "Q_EXAM_004"
        question_content: "您是否有{相关疾病}的病史？"
        question_type: "既往史筛查"
        priority: 4
        answer_format:
          type: "布尔"
          options:
            - "有"
            - "没有"
            - "不确定"
        next_action: "了解相关疾病史"
    
    # 追问流程
    追问流程:
      - step: 1
        question: "Q_EXAM_001"
        purpose: "确认异常指标详情"
      - step: 2
        question: "Q_EXAM_002"
        purpose: "确认检查时间"
      - step: 3
        question: "Q_EXAM_003"
        purpose: "症状筛查"
        condition: "根据异常指标类型选择相关症状"
      - step: 4
        question: "Q_EXAM_004"
        purpose: "既往史筛查"
        condition: "根据异常指标类型选择相关疾病"

# ============================================
# 转换优先级规则
# ============================================
# 定义不同入口类型的转换优先级
转换优先级:
  # 立即转换（最高优先级）
  立即转换:
    priority: 1
    entry_types:
      - "生命体征异常"
      - "明显症状"
    description: "生命体征异常或明显症状需要立即转换为主诉诊断流程"
    action: "立即进入症状诊断路径（B路径）"
  
  # 建议转换（中等优先级）
  建议转换:
    priority: 2
    entry_types:
      - "异常指标"
      - "既往疾病"
    description: "异常指标或既往疾病建议转换为主诉诊断流程"
    action: "建议进入症状诊断路径（B路径），先进行追问确认"
  
  # 可选转换（低优先级）
  可选转换:
    priority: 3
    entry_types:
      - "家族史"
    description: "家族史可以转换为主诉诊断流程，但需要先进行风险评估"
    action: "可选进入症状诊断路径（B路径），先进行家族史追问和风险评估"

# ============================================
# 转换执行流程
# ============================================
转换执行流程:
  # 步骤1：识别入口类型
  步骤1_识别入口类型:
    description: "识别用户输入的入口类型（家族史/既往疾病/异常指标/生命体征异常）"
    methods:
      - "关键词匹配"
      - "LLM辅助识别"
      - "结构化数据识别"
  
  # 步骤2：加载转换规则
  步骤2_加载转换规则:
    description: "根据入口类型加载对应的转换规则"
    methods:
      - "查询家族史转换规则"
      - "查询既往疾病转换规则"
      - "查询异常指标转换规则"
      - "查询生命体征异常转换规则"
  
  # 步骤3：执行转换
  步骤3_执行转换:
    description: "根据转换规则将入口转换为可能的主诉"
    methods:
      - "匹配可能主诉列表"
      - "计算转换置信度"
      - "生成转换原因"
  
  # 步骤4：应用追问策略
  步骤4_应用追问策略:
    description: "根据入口类型应用对应的追问策略"
    methods:
      - "加载追问问题模板"
      - "根据转换规则填充问题内容"
      - "生成追问问题列表"
  
  # 步骤5：路径选择
  步骤5_路径选择:
    description: "根据转换结果选择诊断路径"
    methods:
      - "根据转换优先级选择路径"
      - "如有症状，进入B路径"
      - "如无症状，可进入A路径进行筛查建议"

