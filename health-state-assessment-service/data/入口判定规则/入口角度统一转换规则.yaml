# ============================================
# 使用示例
# ============================================
使用示例:
  # 示例1：家族史转换
  示例1_家族史转换:
    用户输入: "我父亲有糖尿病，我担心自己也会得"
    识别结果:
      entry_type: "家族史"
      entry_value: "糖尿病"
    转换结果:
      - chief_complaint_id: "CC_POLYURIA"
        chief_complaint_name: "多尿"
        confidence: 0.7
      - chief_complaint_id: "CC_POLYDIPSIA"
        chief_complaint_name: "多饮"
        confidence: 0.7
    追问问题:
      - "您家族中具体是哪位亲属有糖尿病？"
      - "您家族中糖尿病的发病年龄大概是多少？"
      - "您自己现在有没有多饮、多尿的症状？"
    最终路径: "B"  # 进入症状诊断路径
  
  # 示例2：既往疾病转换
  示例2_既往疾病转换:
    用户输入: "我有高血压，最近有点头痛"
    识别结果:
      entry_type: "既往疾病"
      entry_value: "高血压"
    转换结果:
      - chief_complaint_id: "CC_HEADACHE"
        chief_complaint_name: "头痛"
        confidence: 0.7
    追问问题:
      - "您高血压是什么时候诊断的？"
      - "您目前高血压的治疗情况如何？是否规律服药？"
      - "您最近头痛的具体情况如何？"
    最终路径: "B"  # 进入症状诊断路径
  
  # 示例3：异常指标转换
  示例3_异常指标转换:
    用户输入: "我体检发现血脂有点高"
    识别结果:
      entry_type: "异常指标"
      entry_value: "高血脂"
    转换结果:
      - chief_complaint_id: "CC_CHEST_PAIN"
        chief_complaint_name: "胸痛"
        confidence: 0.6
    追问问题:
      - "您体检报告中血脂的具体数值是多少？"
      - "您是什么时候做的这个检查？"
      - "您最近有没有胸痛、头晕等症状？"
    最终路径: "B"  # 进入症状诊断路径
  
  # 示例4：生命体征异常转换
  示例4_生命体征异常转换:
    用户输入: "我量血压发现有点高"
    识别结果:
      entry_type: "生命体征异常"
      entry_value: "高血压"
    转换结果:
      - chief_complaint_id: "CC_HEADACHE"
        chief_complaint_name: "头痛"
        confidence: 0.7
      - chief_complaint_id: "CC_DIZZINESS"
        chief_complaint_name: "头晕"
        confidence: 0.7
    追问问题:
      - "您血压的具体数值是多少？"
      - "您是什么时候量的血压？"
      - "您最近有没有头痛、头晕等症状？"
    最终路径: "B"  # 立即进入症状诊断路径（立即转换）

