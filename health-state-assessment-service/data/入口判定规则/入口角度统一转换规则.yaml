# ============================================
# 入口角度统一转换规则
# ============================================
# 对应编号：16 - 入口角度统一转换规则
# 说明：如何将不同入口统一转换为主诉诊断流程
# 文件位置：健康状态评估服务/数据/入口判定规则/入口角度统一转换规则.yaml

元数据:
  配置名称: 入口角度统一转换规则
  版本号: v1.2
  更新时间: 2026-02-04
  说明: "将用户从不同角度（家族史、既往疾病、异常指标、生命体征异常等）提出的问题统一转换为主诉诊断流程"
  对应编号: 16
  文件位置: "健康状态评估服务/数据/入口判定规则/入口角度统一转换规则.yaml"

# ============================================
# 转换规则总览
# ============================================
# 支持将以下入口类型转换为标准主诉链路：
# 1. 家族史 → 可能主诉映射
# 2. 既往疾病 → 可能主诉映射
# 3. 异常指标 → 可能主诉映射
# 4. 生命体征异常 → 可能主诉映射
# 5. 已诊断疾病咨询 → 可能主诉映射
#
# 说明：本规则是入口判定规则的一部分，用于在入口判定阶段识别和处理非标准入口
# 使用时机：在入口判定流程的Step 2（识别症状/困扰）中使用

# ============================================
# 家族史 → 可能主诉映射表
# ============================================
# 将家族史转换为可能的主诉，用于生成问诊问题
家族史转换规则:
  # 心血管疾病家族史
  家族史_心血管疾病:
    rule_id: "CONV_FAMILY_CVD"
    entry_type: "家族史"
    entry_value: "心血管疾病"
    entry_description: "家族中有心血管疾病史（如冠心病、心肌梗死、高血压等）"
    # 可能的主诉列表（按优先级排序）
    可能主诉:
      - chief_complaint_id: "CC_CHEST_PAIN"
        chief_complaint_name: "胸痛"
        priority: 1
        conversion_reason: "家族心血管疾病史，建议关注胸痛症状"
        confidence: 0.7
      - chief_complaint_id: "CC_PALPITATION"
        chief_complaint_name: "心悸"
        priority: 2
        conversion_reason: "家族心血管疾病史，建议关注心悸症状"
        confidence: 0.6
      - chief_complaint_id: "CC_DYSPNEA"
        chief_complaint_name: "呼吸困难"
        priority: 3
        conversion_reason: "家族心血管疾病史，建议关注呼吸困难症状"
        confidence: 0.5
    # 建议筛查项目
    建议筛查:
      - "心电图"
      - "血脂"
      - "血压"
    # 转换后路径
    转换路径: "B"  # 进入症状诊断路径
    转换说明: "家族心血管疾病史，建议进入症状诊断路径，关注相关症状"
  
  # 糖尿病家族史
  家族史_糖尿病:
    rule_id: "CONV_FAMILY_DIABETES"
    entry_type: "家族史"
    entry_value: "糖尿病"
    entry_description: "家族中有糖尿病史"
    可能主诉:
      - chief_complaint_id: "CC_POLYURIA"
        chief_complaint_name: "多尿"
        priority: 1
        conversion_reason: "家族糖尿病史，建议关注多尿症状"
        confidence: 0.7
      - chief_complaint_id: "CC_POLYDIPSIA"
        chief_complaint_name: "多饮"
        priority: 2
        conversion_reason: "家族糖尿病史，建议关注多饮症状"
        confidence: 0.7
      - chief_complaint_id: "CC_WEIGHT_LOSS"
        chief_complaint_name: "体重下降"
        priority: 3
        conversion_reason: "家族糖尿病史，建议关注体重下降"
        confidence: 0.6
    建议筛查:
      - "血糖"
      - "糖化血红蛋白"
    转换路径: "B"
    转换说明: "家族糖尿病史，建议进入症状诊断路径，关注糖尿病相关症状"
  
  # 肿瘤家族史
  家族史_肿瘤:
    rule_id: "CONV_FAMILY_CANCER"
    entry_type: "家族史"
    entry_value: "肿瘤"
    entry_description: "家族中有肿瘤史"
    可能主诉:
      - chief_complaint_id: "CC_WEIGHT_LOSS"
        chief_complaint_name: "体重下降"
        priority: 1
        conversion_reason: "家族肿瘤史，建议关注不明原因体重下降"
        confidence: 0.6
      - chief_complaint_id: "CC_FATIGUE"
        chief_complaint_name: "乏力"
        priority: 2
        conversion_reason: "家族肿瘤史，建议关注乏力症状"
        confidence: 0.5
    建议筛查:
      - "肿瘤标志物"
      - "影像学检查"
    转换路径: "B"
    转换说明: "家族肿瘤史，建议进入症状诊断路径，关注相关症状"

