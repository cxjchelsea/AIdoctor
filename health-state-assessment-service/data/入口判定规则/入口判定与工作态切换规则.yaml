# ============================================
# 入口判定与工作态切换规则
# ============================================
# 对应编号：14 - 入口判定与工作态切换规则
# 说明：健康管理、症状诊断
# 文件位置：健康状态评估服务/数据/入口判定规则/入口判定与工作态切换规则.yaml

元数据:
  配置名称: 入口判定与工作态切换规则
  版本号: v1.0
  更新时间: 2026-02-04
  说明: "入口判定与工作态切换规则，用于判定用户进入健康管理态还是临床诊疗态"

# ============================================
# 入口判定规则
# ============================================
# 根据用户输入判定应该进入哪个工作态
入口判定规则:
  # 健康管理入口（A路径）
  健康管理入口:
    rule_id: "ENTRY_WELLNESS"
    rule_name: "健康管理入口"
    # 触发条件（满足任一条件即可）
    触发条件:
      - "用户明确表示想做体检/筛查"
      - "用户无症状但想了解健康状态"
      - "用户想进行健康管理"
      - "用户描述为健康咨询、体检规划、筛查建议等"
    # 判定结果
    判定结果: "进入健康管理态（A路径）"
    # 路径标识
    路径标识: "A"
    路径名称: "健康筛查路径"
    # 下一步骤
    下一步骤: "A1｜需求分类"
    # 优先级（数字越小优先级越高）
    优先级: 1
    # 判定说明
    说明: "用户明确表示想做体检/筛查，或无症状但想了解健康状态，进入健康管理态"
  
  # 症状诊断入口（B路径）
  症状诊断入口:
    rule_id: "ENTRY_CLINICAL"
    rule_name: "症状诊断入口"
    # 触发条件
    触发条件:
      - "用户描述具体症状"
      - "用户有明确不适"
      - "用户想了解疾病诊断"
      - "用户描述为症状咨询、问题排查、疾病诊断等"
    # 判定结果
    判定结果: "进入临床诊疗态（B路径）"
    # 路径标识
    路径标识: "B"
    路径名称: "症状诊断路径"
    # 下一步骤
    下一步骤: "阶段1｜问诊"
    # 优先级
    优先级: 2
    # 判定说明
    说明: "用户存在症状/困扰，进入症状诊断路径"
  
  # 混合入口（需要澄清）
  混合入口:
    rule_id: "ENTRY_MIXED"
    rule_name: "混合入口"
    # 触发条件
    触发条件:
      - "用户既有症状又想了解健康管理"
      - "不确定是健康管理还是诊断"
      - "用户意图不明确"
    # 判定结果
    判定结果: "先进入健康管理，再根据情况切换"
    # 默认路径（不确定时）
    默认路径: "B"
    默认路径名称: "症状诊断路径"
    # 优先级
    优先级: 3
    # 判定说明
    说明: "用户意图不明确时，默认进入症状诊断路径（安全优先，宁可误报，不能漏报）"
    # 需要澄清
    需要澄清: true
    澄清问题: "这些不舒服是一起开始的吗？还是先后出现像两件事？"

# ============================================
# 工作态切换规则
# ============================================
# 定义在不同工作态之间切换的规则
工作态切换规则:
  # 从健康管理切换到诊断
  从健康管理切换到诊断:
    rule_id: "SWITCH_WELLNESS_TO_CLINICAL"
    rule_name: "从健康管理切换到诊断"
    # 触发条件（满足任一条件即可）
    触发条件:
      - "健康管理过程中发现症状"
      - "用户主动要求诊断"
      - "筛查结果异常"
      - "健康档案建立过程中发现症状"
      - "用户描述新的不适症状"
    # 切换动作
    切换动作: "切换到临床诊疗态（B路径）"
    # 目标路径
    目标路径: "B"
    目标路径名称: "症状诊断路径"
    # 下一步骤
    下一步骤: "阶段1｜问诊"
    # 切换说明
    说明: "健康管理过程中发现症状或用户主动要求诊断，切换到临床诊疗态"
  
  # 从诊断切换到健康管理
  从诊断切换到健康管理:
    rule_id: "SWITCH_CLINICAL_TO_WELLNESS"
    rule_name: "从诊断切换到健康管理"
    # 触发条件
    触发条件:
      - "诊断完成后用户想了解健康管理"
      - "用户主动要求健康管理"
      - "诊断结果正常，用户想进行健康管理"
    # 切换动作
    切换动作: "切换到健康管理态（A路径）"
    # 目标路径
    目标路径: "A"
    目标路径名称: "健康筛查路径"
    # 下一步骤
    下一步骤: "A1｜需求分类"
    # 切换说明
    说明: "诊断完成后用户想了解健康管理，切换到健康管理态"

# ============================================
# 危险信号检查
# ============================================
# 在入口判定时进行危险信号检查，确保安全优先
危险信号检查:
  # 检查时机
  检查时机: "入口判定时"
  # 检查内容
  检查内容:
    - "是否有明显症状"
    - "是否有危险信号"
    - "是否需要立即就医"
  # 处理方式
  处理方式: "如有危险信号，优先进入诊断流程"
  # 危险信号列表（引用规则层）
  危险信号来源: "规则层_风险与急症识别规则"
  # 危险信号检查规则
  检查规则:
    # 如果命中危险信号
    命中危险信号:
      动作: "中断常规问诊"
      下一步: "安全兜底流程"
      路径: "exit"
      路径名称: "退出线上流程"
      说明: "检测到危险信号，建议优先线下就医"
    # 如果未命中危险信号
    未命中危险信号:
      动作: "继续正常入口判定流程"
      说明: "未发现危险信号，按正常流程进行入口判定"

# ============================================
# 路径选择规则
# ============================================
# 根据症状状态和危险信号选择路径
路径选择规则:
  # 规则1：命中危险信号
  规则1_命中危险信号:
    condition: "red_flags_hit == true"
    path: "exit"
    path_name: "退出线上流程"
    next_step: "线下就医"
    reason: "检测到危险信号，建议优先线下就医"
    priority: 0  # 最高优先级
  
  # 规则2：无症状 + 无危险信号
  规则2_无症状无危险信号:
    condition: "symptom_status == 'no_symptom' && red_flags_hit == false"
    path: "A"
    path_name: "健康筛查路径"
    next_step: "A1｜需求分类"
    reason: "用户明确无症状，进入健康筛查路径"
    priority: 1
  
  # 规则3：有症状 + 无危险信号
  规则3_有症状无危险信号:
    condition: "symptom_status == 'has_symptom' && red_flags_hit == false"
    path: "B"
    path_name: "症状诊断路径"
    next_step: "阶段1｜问诊"
    reason: "用户存在症状/困扰，进入症状诊断路径"
    priority: 2
  
  # 规则4：不确定（默认安全优先）
  规则4_不确定:
    condition: "symptom_status == 'uncertain' && red_flags_hit == false"
    path: "B"
    path_name: "症状诊断路径"
    next_step: "阶段1｜问诊"
    reason: "用户意图不明确，默认进入症状诊断路径（安全优先）"
    priority: 3

# ============================================
# 工作态定义
# ============================================
工作态定义:
  # 健康管理态（A路径）
  健康管理态:
    work_mode: "wellness_mode"
    path: "A"
    path_name: "健康筛查路径"
    说明: "用于健康管理、体检规划、筛查建议等场景"
  
  # 临床诊疗态（B路径）
  临床诊疗态:
    work_mode: "clinical_mode"
    path: "B"
    path_name: "症状诊断路径"
    说明: "用于症状诊断、疾病排查、临床问诊等场景"

# ============================================
# 依赖项
# ============================================
依赖项:
  危险信号规则:
    说明: "危险信号识别规则"
    来源: "规则层_风险与急症识别规则"
    用途: "用于危险信号检查"
  症状识别服务:
    说明: "症状识别服务"
    来源: "健康状态评估服务_入口判定_Step2"
    用途: "用于识别用户输入中的症状"
  方向澄清服务:
    说明: "方向澄清服务"
    来源: "健康状态评估服务_入口判定_Step3"
    用途: "用于澄清用户意图（情况C）"

