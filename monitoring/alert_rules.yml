groups:
  - name: service_alerts
    interval: 30s
    rules:
      # 慢请求告警
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "服务响应时间过高"
          description: "{{ $labels.service }} 的95分位响应时间超过2秒，当前值: {{ $value }}秒"

      # 错误率告警
      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_errors_total[5m])) by (service) / 
          sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "服务错误率过高"
          description: "{{ $labels.service }} 的错误率超过5%，当前值: {{ $value | humanizePercentage }}"

      # CPU使用率告警（Java服务）
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(process_cpu_seconds_total[5m])) * 100) < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU使用率过高"
          description: "{{ $labels.instance }} 的CPU使用率超过80%，当前值: {{ $value }}%"

      # 内存使用率告警（Java服务）
      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes / 1024 / 1024 / 1024) > 12
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "{{ $labels.instance }} 的内存使用超过12GB，当前值: {{ $value }}GB"

      # 服务不可用告警
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务不可用"
          description: "{{ $labels.job }} 服务已下线超过1分钟"

      # JVM堆内存告警（Java服务）
      - alert: HighJVMHeapUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM堆内存使用率过高"
          description: "{{ $labels.instance }} 的JVM堆内存使用率超过85%，当前值: {{ $value | humanizePercentage }}"

      # 数据库连接池告警（Java服务）
      - alert: HighDatabaseConnectionPoolUsage
        expr: |
          (hikari_connections_active / hikari_connections_max) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池使用率过高"
          description: "{{ $labels.instance }} 的数据库连接池使用率超过80%，当前值: {{ $value | humanizePercentage }}"

