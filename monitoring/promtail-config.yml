server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 健康状态判定服务（Python）
  - job_name: health-state-assessment-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: health-state-assessment-service
          service: health-state-assessment
          language: python
          __path__: /var/log/aidoctor/health-state-assessment-service/logs/*.log

  # 病例理解服务（Python）
  - job_name: clinical-parsing-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: clinical-parsing-service
          service: clinical-parsing
          language: python
          __path__: /var/log/aidoctor/clinical-parsing-service/logs/*.log

  # 诊断引擎服务（Python）
  - job_name: diagnosis-engine-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: diagnosis-engine-service
          service: diagnosis-engine
          language: python
          __path__: /var/log/aidoctor/diagnosis-engine-service/logs/*.log

  # OCR服务（Python）
  - job_name: ocr-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: ocr-service
          service: ocr
          language: python
          __path__: /var/log/aidoctor/ocr-service/logs/*.log

  # 对话服务（Python）
  - job_name: dialog-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: dialog-service
          service: dialog
          language: python
          __path__: /var/log/aidoctor/dialog-service/logs/*.log

  # 解释生成服务（Python）
  - job_name: explanation-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: explanation-service
          service: explanation
          language: python
          __path__: /var/log/aidoctor/explanation-service/logs/*.log

  # 检查建议服务（Python）
  - job_name: workup-planner-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: workup-planner-service
          service: workup-planner
          language: python
          __path__: /var/log/aidoctor/workup-planner-service/logs/*.log

  # 治疗推理服务（Python）
  - job_name: treatment-engine-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: treatment-engine-service
          service: treatment-engine
          language: python
          __path__: /var/log/aidoctor/treatment-engine-service/logs/*.log

  # 风险评估服务（Python）
  - job_name: risk-assessment-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: risk-assessment-service
          service: risk-assessment
          language: python
          __path__: /var/log/aidoctor/risk-assessment-service/logs/*.log

  # 诊断服务（Java）
  - job_name: diagnosis-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: diagnosis-service
          service: diagnosis
          language: java
          __path__: /var/log/aidoctor/diagnosis-service/logs/*.log

  # 检查服务（Java）
  - job_name: examination-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: examination-service
          service: examination
          language: java
          __path__: /var/log/aidoctor/examination-service/logs/*.log

  # 执行追踪服务（Java）
