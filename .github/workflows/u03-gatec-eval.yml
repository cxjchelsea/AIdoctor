name: U03 Gate C Governed Evaluation

on:
  workflow_dispatch:
    inputs:
      independent_review_confirmed:
        description: 'Set to EXACTLY REVIEW_COMPLETE before governed GC/SS execution'
        required: true
        type: string

permissions:
  contents: read

jobs:
  governed-offline-evaluation:
    if: ${{ inputs.independent_review_confirmed == 'REVIEW_COMPLETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Governance guard
        run: |
          test "${{ inputs.independent_review_confirmed }}" = "REVIEW_COMPLETE"
          echo "Independent implementation review explicitly confirmed."
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Python runtime
        run: python3 --version
      - name: Run evaluation harness self-tests
        working-directory: tools/u03_gatec_eval
        run: python3 -m unittest -v
      - name: Execute governed Gate C evaluation
        working-directory: tools/u03_gatec_eval
        run: python3 run_evaluation.py
      - name: Verify result bundle summary
        working-directory: tools/u03_gatec_eval
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/u03-gatec-eval/result-bundle.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          s = data['summary']
          assert s['golden_total'] == 31
          assert s['golden_pass'] == 31
          assert s['golden_fail'] == 0
          assert s['critical_safety_total'] == 20
          assert s['critical_safety_pass'] == 20
          assert s['critical_safety_fail'] == 0
          assert s['gate_c_execution_blocked_by_critical_failure'] is False
          assert data['production_state_mutation_capability'] is False
          assert data['network_access_required'] is False
          print(json.dumps(s, indent=2, ensure_ascii=False))
          PY
