name: U03 Verification

on:
  push:
    branches:
      - impl/u03-current-version-risk-assessment
  pull_request:
    branches:
      - main
    paths:
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u03/**'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u03/**'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/governance/**'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/governance/**'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/state/committer/**'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/state/committer/**'
      - 'diagnosis-service/src/main/resources/db/migration/**'
      - 'docs/current/06_开发单元/**'
      - '.github/workflows/u03-verification.yml'

permissions:
  contents: read

jobs:
  u03-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install Shared Contracts v1 Java binding
        run: mvn -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Compile diagnosis-service
        run: mvn -f diagnosis-service/pom.xml -DskipTests compile
      - name: Run U03 and predecessor focused tests
        run: >-
          mvn -f diagnosis-service/pom.xml
          -Dtest='U03GovernanceBoundaryTest,U03RiskAssessmentFlowTest,Foundation1GovernanceTest,U02ClinicalFactFormationTest,U02ClinicalFactCommitServiceTest,U02ClinicalFactApplicationServiceTest,StateCommitterArchitectureGuardTest,StateCommitterContractBoundaryTest,StateCommitterMechanicalCoreTest,SyntheticVersionedStateRepositoryTest'
          test
      - name: Run diagnosis-service regression suite
        run: mvn -f diagnosis-service/pom.xml test
