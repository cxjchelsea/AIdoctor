name: U07 Workpack A - Database Baseline and CDP Commit Safety
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/u07-workpack-a-persistence.yml'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/production_persistence_preflight.py'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/test_production_persistence_preflight.py'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpStateRepositoryAdapterTest.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpStateRepositoryAdapter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpReadbackAdapter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07ClinicalHostServicesConfig.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u03/U07ClinicalHostServiceMysqlTest.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07WorkpackACdpPhysicalMysqlTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-and-adapter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify read-only historical migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/u07_d5_o2_tx_topology/production_candidate -p 'test_production_persistence_preflight.py' -v
          python3 tools/u07_d5_o2_tx_topology/production_candidate/test_flyway_history.py -v
          python3 tools/u07_d5_o2_tx_topology/production_candidate/production_persistence_preflight.py > "$RUNNER_TEMP/u07-workpack-a-inventory.json"
          python3 - "$RUNNER_TEMP/u07-workpack-a-inventory.json" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['structural_invariants'] == 'PASS'
          assert x['production_migration_decision'] == 'BLOCK'
          assert x['production_clinical_state_activation'] == 'BLOCK'
          assert x['observations']['original_mysql_v1_clob_tokens'] == 9
          assert not x['observations']['database_history_evidence_supplied']
          print('U07_WORKPACK_A_OFFLINE_RELEASE_BOUNDARY=PASS_BLOCK_PRODUCTION')
          PY
      - name: Install shared Java8 contract
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Execute focused CDP adapter state-commit safety regression
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f diagnosis-service/pom.xml -Dtest=ClinicalCdpStateRepositoryAdapterTest test
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('diagnosis-service/target/surefire-reports/TEST-*ClinicalCdpStateRepositoryAdapterTest.xml')
          assert len(paths) == 1, paths
          report = ET.parse(paths[0]).getroot()
          assert int(report.get('tests', -1)) >= 7
          assert all(int(report.get(x,-1)) == 0 for x in ('failures','errors','skipped'))
          print('U07_WORKPACK_A_CDP_ADAPTER_SAFETY=PASS')
          PY

  physical-cdp-mysql8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-workpack-a-root
          MYSQL_DATABASE: u07_workpack_a_cdp
        ports:
          - 127.0.0.1:33332:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-workpack-a-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      U07_WORKPACK_A_MYSQL_MODE: DISPOSABLE_CDP_ONLY
      U07_WORKPACK_A_MYSQL_URL: jdbc:mysql://127.0.0.1:33332/u07_workpack_a_cdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Bootstrap test-only CDP JPA compatibility tables on disposable MySQL8
        shell: bash
        env:
          MYSQL_PWD: synthetic-workpack-a-root
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$U07_WORKPACK_A_MYSQL_MODE" = DISPOSABLE_CDP_ONLY
          mysql -h127.0.0.1 -P33332 -uroot u07_workpack_a_cdp <<'SQL'
          CREATE TABLE cdp (
            id VARCHAR(64) NOT NULL PRIMARY KEY,
            patient_id VARCHAR(64) NOT NULL,
            session_id VARCHAR(64) NOT NULL,
            version_no INT NOT NULL,
            cdp_status VARCHAR(64),
            health_state_assessment LONGTEXT,
            wellness_plan LONGTEXT,
            patient_state LONGTEXT,
            ddx LONGTEXT,
            evidence_graph LONGTEXT,
            workup_plan LONGTEXT,
            management_plan LONGTEXT,
            triage LONGTEXT,
            uncertainty LONGTEXT,
            audit_info LONGTEXT,
            execution_trace LONGTEXT,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            KEY idx_patient_id (patient_id),
            KEY idx_session_id (session_id),
            KEY idx_version (version_no)
          ) ENGINE=InnoDB;
          CREATE TABLE cdp_version (
            id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            cdp_id VARCHAR(64),
            version_number INT,
            cdp_data LONGTEXT,
            create_time DATETIME,
            KEY idx_workpack_a_version (cdp_id, version_number)
          ) ENGINE=InnoDB;
          SQL
      - name: Install shared Java8 binding and compile exact test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f contracts/v1/bindings/java/pom.xml install -DskipTests
          mvn -B -ntp -f diagnosis-service/pom.xml -DskipTests test-compile
      - name: Real Spring JPA CDP version CAS and rollback on disposable MySQL8
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f diagnosis-service/pom.xml -Dtest=U07WorkpackACdpPhysicalMysqlTest,U07ClinicalHostServiceMysqlTest surefire:test
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          paths=glob.glob("diagnosis-service/target/surefire-reports/TEST-*U07WorkpackACdpPhysicalMysqlTest.xml")
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          assert int(root.get("tests",-1))==4
          assert all(int(root.get(k,-1))==0 for k in ("failures","errors","skipped"))
          clinical=glob.glob("diagnosis-service/target/surefire-reports/TEST-*U07ClinicalHostServiceMysqlTest.xml")
          assert len(clinical)==1,clinical
          host=ET.parse(clinical[0]).getroot()
          assert int(host.get("tests",-1))==2
          assert all(int(host.get(k,-1))==0 for k in ("failures","errors","skipped"))
          print("U07_WORKPACK_A_REAL_SPRING_JPA_MYSQL8_CDP_AND_HOST_U04=PASS")
          PY
