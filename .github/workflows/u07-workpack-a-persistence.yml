name: U07 Workpack A - Database Baseline and CDP Commit Safety
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/u07-workpack-a-persistence.yml'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/production_persistence_preflight.py'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/u07_release_gate.py'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/test_u07_release_gate.py'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/U07_PRODUCTION_RELEASE_DECISION.md'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/test_production_persistence_preflight.py'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpStateRepositoryAdapterTest.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpU05ReadinessSnapshotAdapter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpStateRepositoryAdapter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpReadbackAdapter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07ClinicalHostServicesConfig.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpGateReadbackAdapter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/ClinicalCdpF3BoundA1AuthorityPort.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07DurableNonProductionA1Issuer.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07NonProductionPhysicalF3Owner.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07GovernedNonProductionF3CommitPort.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U06ProfileBApplicationService.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U06NonProductionPhysicalMode1Service.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U06NonProductionPhysicalMode23Service.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U07NonProductionDeliveryWaitRecovery.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U07ExistingU06WaitAuthority.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07TrustedF3RevalidationWriter.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07DurableClinicalHostIntegrationConfig.java'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/mysql8/V9__u07_clinical_receipts_no_dispatch.sql'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/oracle/V9__u07_clinical_receipts_no_dispatch.sql'
      - 'tools/u07_d5_o2_tx_topology/production_candidate/U07_V9_HOST_DEPLOYMENT_READINESS.md'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07NonProductionTrustedAnswerU02Bridge.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07NonProductionResumedClinicalPipeline.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07NonProductionDurableF8Consume.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u01/ConsultationRecord.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeThreadStateRecord.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeWaitCheckpointRecord.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07NonProductionTrustedAnswerU02BridgeTest.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U06ExecutionResult.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/U06NonProductionPhysicalF3DecisionProvider.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07NonProductionF3A1U05Flow.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07PersistedF3OwnerBarrierRevalidationEvidence.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u03/U07ClinicalHostServiceMysqlTest.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07WorkpackACdpPhysicalMysqlTest.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/adapters/U07U06SelectionPhysicalMysqlTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-and-adapter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify read-only historical migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/u07_d5_o2_tx_topology/production_candidate -p 'test_production_persistence_preflight.py' -v
          python3 tools/u07_d5_o2_tx_topology/production_candidate/test_flyway_history.py -v
          python3 -m unittest discover -s tools/u07_d5_o2_tx_topology/production_candidate -p 'test_u07_release_gate.py' -v
          python3 tools/u07_d5_o2_tx_topology/production_candidate/u07_release_gate.py > "$RUNNER_TEMP/u07-release-gate.json" || status=$?
          test "${status:-2}" -eq 2
          python3 - "$RUNNER_TEMP/u07-release-gate.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["decision"]=="BLOCK"
          assert x["production_migration"]=="BLOCK"
          assert x["production_clinical_activation"]=="BLOCK"
          assert x["production_patient_delivery"]=="BLOCK"
          assert "EVIDENCE_MAP_MISSING" in x["failures"]
          print("U07_PRODUCTION_EVIDENCE_RELEASE_GATE=PASS_BLOCK")
          PY
          python3 tools/u07_d5_o2_tx_topology/production_candidate/production_persistence_preflight.py > "$RUNNER_TEMP/u07-workpack-a-inventory.json"
          python3 - "$RUNNER_TEMP/u07-workpack-a-inventory.json" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['structural_invariants'] == 'PASS'
          assert x['production_migration_decision'] == 'BLOCK'
          assert x['production_clinical_state_activation'] == 'BLOCK'
          assert x['observations']['original_mysql_v1_clob_tokens'] == 9
          assert not x['observations']['database_history_evidence_supplied']
          print('U07_WORKPACK_A_OFFLINE_RELEASE_BOUNDARY=PASS_BLOCK_PRODUCTION')
          PY
      - name: Install shared Java8 contract
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Execute focused CDP adapter state-commit safety regression
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f diagnosis-service/pom.xml -Dtest=ClinicalCdpStateRepositoryAdapterTest test
          mvn -B -ntp -f diagnosis-service/pom.xml -Dtest=U07NonProductionTrustedAnswerU02BridgeTest test
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('diagnosis-service/target/surefire-reports/TEST-*ClinicalCdpStateRepositoryAdapterTest.xml')
          assert len(paths) == 1, paths
          report = ET.parse(paths[0]).getroot()
          assert int(report.get('tests', -1)) >= 7
          assert all(int(report.get(x,-1)) == 0 for x in ('failures','errors','skipped'))
          print('U07_WORKPACK_A_CDP_ADAPTER_SAFETY=PASS')
          PY

  physical-cdp-mysql8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-workpack-a-root
          MYSQL_DATABASE: u07_workpack_a_cdp
        ports:
          - 127.0.0.1:33332:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-workpack-a-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      U07_WORKPACK_A_MYSQL_MODE: DISPOSABLE_CDP_ONLY
      U07_WORKPACK_A_MYSQL_URL: jdbc:mysql://127.0.0.1:33332/u07_workpack_a_cdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Bootstrap test-only CDP JPA compatibility tables on disposable MySQL8
        shell: bash
        env:
          MYSQL_PWD: synthetic-workpack-a-root
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$U07_WORKPACK_A_MYSQL_MODE" = DISPOSABLE_CDP_ONLY
          mysql -h127.0.0.1 -P33332 -uroot u07_workpack_a_cdp <<'SQL'
          CREATE TABLE cdp (
            id VARCHAR(64) NOT NULL PRIMARY KEY,
            patient_id VARCHAR(64) NOT NULL,
            session_id VARCHAR(64) NOT NULL,
            version_no INT NOT NULL,
            cdp_status VARCHAR(64),
            health_state_assessment LONGTEXT,
            wellness_plan LONGTEXT,
            patient_state LONGTEXT,
            ddx LONGTEXT,
            evidence_graph LONGTEXT,
            workup_plan LONGTEXT,
            management_plan LONGTEXT,
            triage LONGTEXT,
            uncertainty LONGTEXT,
            audit_info LONGTEXT,
            execution_trace LONGTEXT,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            KEY idx_patient_id (patient_id),
            KEY idx_session_id (session_id),
            KEY idx_version (version_no)
          ) ENGINE=InnoDB;
          CREATE TABLE cdp_version (
            id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            cdp_id VARCHAR(64),
            version_number INT,
            cdp_data LONGTEXT,
            create_time DATETIME,
            KEY idx_workpack_a_version (cdp_id, version_number)
          ) ENGINE=InnoDB;
          CREATE TABLE clinical_consultation (
            consultation_id VARCHAR(128) PRIMARY KEY, row_version BIGINT NOT NULL,
            cdp_id VARCHAR(128) NOT NULL UNIQUE, user_id VARCHAR(128) NOT NULL,
            lifecycle_status VARCHAR(32) NOT NULL, current_wait_effect_id VARCHAR(128),
            subject_status VARCHAR(32) NOT NULL, subject_type VARCHAR(32),
            subject_reference_id VARCHAR(128), problem_status VARCHAR(32) NOT NULL,
            problem_text VARCHAR(2000), scope_decision VARCHAR(32) NOT NULL,
            clarification_reason VARCHAR(128), early_safety_signal BIT NOT NULL,
            start_event_id VARCHAR(128) NOT NULL UNIQUE, created_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE clinical_consultation_wait_effect (
            wait_effect_id VARCHAR(128) PRIMARY KEY,
            parent_delivered_wait_effect_id VARCHAR(128) NOT NULL UNIQUE,
            consultation_id VARCHAR(128) NOT NULL, question_id VARCHAR(128) NOT NULL,
            delivery_id VARCHAR(128) NOT NULL, payload_fingerprint VARCHAR(128) NOT NULL,
            idempotency_key VARCHAR(128) NOT NULL UNIQUE,
            expected_prior_lifecycle VARCHAR(32) NOT NULL, expected_prior_row_version BIGINT NOT NULL,
            committed_lifecycle VARCHAR(32) NOT NULL, committed_row_version BIGINT NOT NULL,
            effect_status VARCHAR(32) NOT NULL, created_at DATETIME NOT NULL,
            committed_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE clinical_runtime_thread_state (
            thread_id VARCHAR(128) PRIMARY KEY, consultation_id VARCHAR(128) NOT NULL UNIQUE,
            row_version BIGINT NOT NULL, runtime_status VARCHAR(32) NOT NULL,
            current_run_id VARCHAR(128), current_wait_checkpoint_id VARCHAR(128),
            current_wait_effect_id VARCHAR(128), updated_at DATETIME NOT NULL,
            created_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE clinical_runtime_wait_checkpoint (
            checkpoint_id VARCHAR(128) PRIMARY KEY, consultation_id VARCHAR(128) NOT NULL,
            thread_id VARCHAR(128) NOT NULL, run_id VARCHAR(128) NOT NULL,
            question_id VARCHAR(128) NOT NULL, pending_question_ref VARCHAR(256) NOT NULL,
            question_selection_effect_id VARCHAR(128) NOT NULL,
            question_delivery_effect_id VARCHAR(128) NOT NULL,
            question_delivered_wait_effect_id VARCHAR(128) NOT NULL UNIQUE,
            delivery_id VARCHAR(128) NOT NULL, delivery_confirmation_ref VARCHAR(128) NOT NULL,
            clinical_state_version INT NOT NULL, consultation_wait_effect_id VARCHAR(128) NOT NULL,
            dependency_binding_ref VARCHAR(128), question_policy_ref VARCHAR(128),
            payload_fingerprint VARCHAR(128) NOT NULL, checkpoint_status VARCHAR(32) NOT NULL,
            created_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE clinical_runtime_binding (
            consultation_id VARCHAR(128) PRIMARY KEY, cdp_id VARCHAR(128) NOT NULL,
            runtime_authority VARCHAR(64) NOT NULL, thread_id VARCHAR(128) NOT NULL,
            scope_version VARCHAR(64) NOT NULL, capability_set_version VARCHAR(64) NOT NULL,
            contract_version VARCHAR(64) NOT NULL, created_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE canonical_business_event (
            event_id VARCHAR(128) PRIMARY KEY, consultation_id VARCHAR(128) NOT NULL,
            event_type VARCHAR(64) NOT NULL, idempotency_key VARCHAR(128) NOT NULL UNIQUE,
            payload_digest VARCHAR(128) NOT NULL, received_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE clinical_runtime_run (
            run_id VARCHAR(128) PRIMARY KEY, thread_id VARCHAR(128) NOT NULL,
            consultation_id VARCHAR(128) NOT NULL, event_id VARCHAR(128) NOT NULL,
            based_on_clinical_state_version INT NOT NULL, status VARCHAR(32) NOT NULL,
            created_at DATETIME NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE u07_f8_answer_consumption (
            checkpoint_id VARCHAR(128) NOT NULL PRIMARY KEY,
            consultation_id VARCHAR(128) NOT NULL,
            waiting_run_id VARCHAR(128) NOT NULL,
            answer_event_id VARCHAR(128) NOT NULL UNIQUE,
            answer_digest VARCHAR(128) NOT NULL,
            new_run_id VARCHAR(128) NOT NULL UNIQUE,
            CONSTRAINT fk_u07_f8_wait_checkpoint FOREIGN KEY (checkpoint_id)
              REFERENCES clinical_runtime_wait_checkpoint(checkpoint_id)
          ) ENGINE=InnoDB;
          SQL
      - name: Apply isolated V9 clinical evidence candidate on disposable MySQL8
        shell: bash
        env:
          MYSQL_PWD: synthetic-workpack-a-root
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$U07_WORKPACK_A_MYSQL_MODE" = DISPOSABLE_CDP_ONLY
          mysql -h127.0.0.1 -P33332 -uroot u07_workpack_a_cdp \
            < tools/u07_d5_o2_tx_topology/production_candidate/mysql8/V9__u07_clinical_receipts_no_dispatch.sql
          python3 - <<'PY'
          from pathlib import Path
          mysql=Path("tools/u07_d5_o2_tx_topology/production_candidate/mysql8/V9__u07_clinical_receipts_no_dispatch.sql").read_text()
          oracle=Path("tools/u07_d5_o2_tx_topology/production_candidate/oracle/V9__u07_clinical_receipts_no_dispatch.sql").read_text()
          tables=("u07_f3_owner_evidence","u07_f3_barrier_evidence",
                  "u07_f3_revalidation_evidence","u07_a1_attestation",
                  "u07_question_delivery_evidence","u07_question_wait_evidence")
          for table in tables:
              assert "CREATE TABLE "+table in mysql
              assert "CREATE TABLE "+table in oracle
          for folder in ("db/migration","db/migration-oracle"):
              from pathlib import Path
              assert not any(p.name.startswith("V9__u07_clinical_receipts")
                             for p in Path("diagnosis-service/src/main/resources",folder).glob("V*.sql"))
          print("U07_ISOLATED_V9_SCHEMA_AND_PRODUCTION_FENCE=PASS")
          PY
      - name: Install shared Java8 binding and compile exact test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f contracts/v1/bindings/java/pom.xml install -DskipTests
          mvn -B -ntp -f diagnosis-service/pom.xml -DskipTests test-compile
      - name: Real Spring JPA CDP version CAS and rollback on disposable MySQL8
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f diagnosis-service/pom.xml -Dtest=U07WorkpackACdpPhysicalMysqlTest,U07ClinicalHostServiceMysqlTest,U07U06SelectionPhysicalMysqlTest surefire:test
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          paths=glob.glob("diagnosis-service/target/surefire-reports/TEST-*U07WorkpackACdpPhysicalMysqlTest.xml")
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          assert int(root.get("tests",-1))==11
          assert all(int(root.get(k,-1))==0 for k in ("failures","errors","skipped"))
          clinical=glob.glob("diagnosis-service/target/surefire-reports/TEST-*U07ClinicalHostServiceMysqlTest.xml")
          assert len(clinical)==1,clinical
          host=ET.parse(clinical[0]).getroot()
          assert int(host.get("tests",-1))==8
          assert all(int(host.get(k,-1))==0 for k in ("failures","errors","skipped"))
          mode2=glob.glob("diagnosis-service/target/surefire-reports/TEST-*U07U06SelectionPhysicalMysqlTest.xml")
          assert len(mode2)==1,mode2
          selection=ET.parse(mode2[0]).getroot()
          assert int(selection.get("tests",-1))==1
          assert all(int(selection.get(k,-1))==0 for k in ("failures","errors","skipped"))
          print("U07_U06_MYSQL_MODE2_SELECTION=PASS; SYNTHETIC_CONFIRMED_DELIVERY_DURABLE_WAIT=PASS; REAL_DELIVERY_AUTHORITY=BLOCK")
          print("U07_WORKPACK_A_REAL_SPRING_JPA_MYSQL8_CDP_AND_HOST_U04=PASS")
          PY
