name: U07 D5-O2 isolated non-DB dual-tree feasibility probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/u07-d5-o2-dualtree-nondb-probe.yml'
      - 'tools/u07_d5_o2_tx_topology/stageb/mainexact_probe/**'
permissions:
  contents: read
jobs:
  java8-dual-tree-nondb-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PROBE_CONTROL_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact probe control HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout historical post-463 main source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 33c0914e843d7976c7ff2272338377aa4925f443
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Configure Java 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Exact dual-tree non-DB compile, JUnit discovery and selector negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$PROBE_CONTROL_HEAD"
          test "$(git -C source rev-parse HEAD)" = 33c0914e843d7976c7ff2272338377aa4925f443
          test "$(java -version 2>&1 | head -n1 | grep -c '1.8')" = 1
          python3 control/tools/u07_d5_o2_tx_topology/stageb/mainexact_probe/probe.py

      - name: Independent allowlist and run-identity evidence admission
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/u07_d5_o2_tx_topology/stageb/mainexact_probe/probe.py --verify
      - name: Upload exclusively admitted non-DB evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: u07-d5-o2-exact-head-nondb-probe-evidence
          path: ${{ runner.temp }}/u07-nondb-probe-evidence.json
          if-no-files-found: error
          retention-days: 7
