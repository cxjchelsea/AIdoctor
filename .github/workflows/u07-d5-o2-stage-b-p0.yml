name: U07 D5-O2 Stage B P0 isolated JPA JDBC fault-hook
on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u07/d5o2/stageb/**'
      - 'diagnosis-service/src/test/resources/u07/d5o2/stageb/**'
      - 'tools/u07_d5_o2_tx_topology/stageb/**'
      - '.github/workflows/u07-d5-o2-stage-b-p0.yml'
permissions:
  contents: read
jobs:
  stage-b-p0-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-stageb-root
          MYSQL_DATABASE: u07_d5o2_stage_b_p0
        ports:
          - 33327:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-stageb-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      U07_D5O2_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      U07_D5O2_PR_NUMBER: ${{ github.event.pull_request.number }}
      U07_D5O2_PROFILE: U07_D5O2_STAGE_B_P0_SYNTHETIC
      U07_D5O2_SCHEMA: u07_d5o2_stage_b_p0
      U07_D5O2_URL: jdbc:mysql://127.0.0.1:33327/u07_d5o2_stage_b_p0?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Validate fixed disposable context
        run: |
          set -euo pipefail
          test "$U07_D5O2_PROFILE" = U07_D5O2_STAGE_B_P0_SYNTHETIC
          test "$U07_D5O2_SCHEMA" = u07_d5o2_stage_b_p0
          test "$U07_D5O2_URL" = 'jdbc:mysql://127.0.0.1:33327/u07_d5o2_stage_b_p0?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          git rev-parse HEAD
          test -n "$U07_D5O2_PR_HEAD_SHA"
          test "$(git rev-parse HEAD^2)" = "$U07_D5O2_PR_HEAD_SHA"
          java -version
      - name: Original immutable DDL with least-privilege P0 roles
        env:
          MYSQL_PWD: synthetic-stageb-root
        run: |
          set -euo pipefail
          python3 tools/u07_d5_o2_tx_topology/stageb/bootstrap-p0-schema.py > /tmp/stage-b-p0.sql
          mysql -h 127.0.0.1 -P 33327 -uroot u07_d5o2_stage_b_p0 < /tmp/stage-b-p0.sql
      - name: Install Java shared contracts
        run: mvn -B -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Java 8 P0 test compile
        run: mvn -B -f diagnosis-service/pom.xml -DskipTests test-compile
      - name: Execute exact Java8 real MySQL8 Stage B P0 scope
        run: |
          set -euo pipefail
          mvn -B -f diagnosis-service/pom.xml -Dtest=StageBTxOwnerBindingTest,StageBJdbcFaultHookTest test
          python3 tools/u07_d5_o2_tx_topology/stageb/verify-p0-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: u07-d5-o2-stage-b-p0-surefire
          path: |
            diagnosis-service/target/surefire-reports/TEST-*StageB*.xml
            diagnosis-service/target/u07-d5o2-stage-b-p0-evidence.json
