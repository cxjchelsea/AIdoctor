name: U07 D5-O2 six-table durable replay MySQL8 verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/u07-d5-o2-six-table-replay.yml'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/delivery/JdbcU06DeliveryStore.java'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u07/d5o2/stageb/forensics/StageBSixTableReplayTest.java'
permissions:
  contents: read
jobs:
  six-table-replay-real-mysql8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-replay-disposable-root
          MYSQL_DATABASE: u07_d5o2_f_deadlock
        ports:
          - 127.0.0.1:33331:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-replay-disposable-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      U07_F_PROFILE: U07_D5_O2_RACE05_F_ISOLATED_SYNTHETIC
      U07_F_ISOLATED: 'true'
      U07_F_URL: jdbc:mysql://127.0.0.1:33331/u07_d5o2_f_deadlock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      U07_REPLAY_SYNTHETIC_ADMIN_PWD: synthetic-replay-disposable-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify disposable fixture and exact implementation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$U07_F_ISOLATED" = true
          test "$U07_F_PROFILE" = U07_D5_O2_RACE05_F_ISOLATED_SYNTHETIC
          java -version
      - name: Bootstrap immutable six-table DDL and synthetic isolated identities
        shell: bash
        env:
          MYSQL_PWD: synthetic-replay-disposable-root
        run: |
          set -euo pipefail
          for role in WRITER READER OBSERVER; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf 'F_%s_PWD=%s\n' "$role" "$value" >> "$GITHUB_ENV"
            export "F_${role}_PWD=$value"
          done
          umask 077
          private_sql="$(mktemp "$RUNNER_TEMP/six-table-ddl-XXXXXX")"
          trap 'rm -f "$private_sql"' EXIT
          python3 tools/u07_d5_o2_tx_topology/stageb/forensics/bootstrap-and-verify.py bootstrap >"$private_sql"
          mysql -h127.0.0.1 -P33331 -uroot u07_d5o2_f_deadlock <"$private_sql"
      - name: Compile Java8 shared contract and diagnosis service
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f contracts/v1/bindings/java/pom.xml install -DskipTests
          mvn -B -ntp -f diagnosis-service/pom.xml -DskipTests test-compile
      - name: Run real six-table replay integrity regression without broad suite
        shell: bash
        run: |
          set -euo pipefail
          private_log="$(mktemp "$RUNNER_TEMP/six-table-replay-mvn-XXXXXX")"
          trap 'rm -f "$private_log"' EXIT
          if ! mvn -B -ntp -f diagnosis-service/pom.xml -Dtest=StageBSixTableReplayTest surefire:test >"$private_log" 2>&1; then
            echo SIX_TABLE_REPLAY_REAL_MYSQL8_TEST_FAILED
            exit 1
          fi
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths=glob.glob("diagnosis-service/target/surefire-reports/TEST-*StageBSixTableReplayTest.xml")
          assert len(paths)==1, "EXPECTED_EXACTLY_ONE_REPORT"
          root=ET.parse(paths[0]).getroot()
          assert int(root.get("tests","-1"))==7, "EXPECTED_SEVEN_TESTS"
          assert all(int(root.get(k,"-1"))==0 for k in ("failures","errors","skipped")), "SIX_TABLE_REPLAY_NOT_GREEN"
          print("U07_SIX_TABLE_DURABLE_REPLAY_REAL_MYSQL8=PASS")
          PY
