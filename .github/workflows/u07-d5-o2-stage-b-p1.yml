name: U07 D5-O2 Stage B P1A six-ordinal synthetic MySQL8
on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u07/d5o2/stageb/p1/**'
      - 'diagnosis-service/src/test/resources/u07/d5o2/stageb/p1/**'
      - 'tools/u07_d5_o2_tx_topology/stageb/p1/**'
      - '.github/workflows/u07-d5-o2-stage-b-p1.yml'
permissions:
  contents: read
jobs:
  p1a-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-stagebp1-root
          MYSQL_DATABASE: u07_d5o2_stage_b_p1
        ports:
          - 33328:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-stagebp1-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      U07_D5O2_PROFILE: U07_D5O2_STAGE_B_P1_SYNTHETIC
      U07_D5O2_SCHEMA: u07_d5o2_stage_b_p1
      U07_D5O2_URL: jdbc:mysql://127.0.0.1:33328/u07_d5o2_stage_b_p1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      U07_D5O2_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Source and exact PR HEAD
        run: |
          set -euo pipefail
          test "$U07_D5O2_PROFILE" = U07_D5O2_STAGE_B_P1_SYNTHETIC
          test "$U07_D5O2_SCHEMA" = u07_d5o2_stage_b_p1
          test "$U07_D5O2_URL" = 'jdbc:mysql://127.0.0.1:33328/u07_d5o2_stage_b_p1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          test "$(git rev-parse HEAD^2)" = "$U07_D5O2_PR_HEAD_SHA"
          java -version
      - name: Pin original V2 V3 V6 DDL and create synthetic roles
        env:
          MYSQL_PWD: synthetic-stagebp1-root
        run: |
          set -euo pipefail
          python3 tools/u07_d5_o2_tx_topology/stageb/p1/bootstrap-p1-schema.py > /tmp/p1a-schema.sql
          mysql -h 127.0.0.1 -P 33328 -uroot u07_d5o2_stage_b_p1 < /tmp/p1a-schema.sql
      - name: Java shared bindings install
        run: mvn -B -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Real Java8 P1A test compile
        run: mvn -B -f diagnosis-service/pom.xml -DskipTests test-compile
      - name: Physical six faults plus success and replay
        run: |
          set -euo pipefail
          mvn -B -f diagnosis-service/pom.xml -Dtest=StageBP1AtomicityTest,StageBP1ReplayConflictTest test
          python3 tools/u07_d5_o2_tx_topology/stageb/p1/verify-p1-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: u07-d5-o2-stage-b-p1a-surefire
          path: |
            diagnosis-service/target/surefire-reports/TEST-*StageBP1*.xml
            diagnosis-service/target/u07-d5o2-stage-b-p1a-evidence.json
