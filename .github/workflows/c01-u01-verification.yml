name: C01-U01 Verification

on:
  push:
    branches:
      - impl/c01-u01-clinical-understanding
  pull_request:
    branches:
      - main
    paths:
      - 'clinical-parsing-service/**'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/client/C01U01CapabilityClient.java'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/dto/capability/c01/**'
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u01/**'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u01/**'
      - 'docs/current/07_能力设计/**'
      - '.github/workflows/c01-u01-verification.yml'

permissions:
  contents: read

jobs:
  c01-python:
    name: c01-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clinical-parsing-service/requirements.txt
      - name: Install clinical parsing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r clinical-parsing-service/requirements.txt
          python -m pip install pytest
      - name: Compile clinical parsing service
        working-directory: clinical-parsing-service
        run: python -m compileall app
      - name: Run C01 U01 eval slice
        working-directory: clinical-parsing-service
        run: python -m pytest test_c01_u01.py -q
      - name: Run existing clinical parsing regression
        working-directory: clinical-parsing-service
        run: python -m pytest test_service.py -q

  c01-java:
    name: c01-java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install Shared Contracts v1 Java binding
        run: mvn -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Compile diagnosis-service
        run: mvn -f diagnosis-service/pom.xml -DskipTests compile
      - name: Run C01, U01, Foundation and StateCommitter focused tests
        run: >-
          mvn -f diagnosis-service/pom.xml
          -Dtest='C01U01CapabilityGatewayTest,U01NaturalLanguageStartServiceTest,U01SemanticPolicyTest,U01ConsultationServiceTest,U01LegacyBoundaryGuardTest,FoundationRuntimeBaseTest,ClinicalCdpStateRepositoryAdapterTest,StateCommitterArchitectureGuardTest,StateCommitterContractBoundaryTest,StateCommitterMechanicalCoreTest,SyntheticVersionedStateRepositoryTest'
          test
      - name: Run diagnosis-service regression suite
        run: mvn -f diagnosis-service/pom.xml test
