name: U07 D5-O2 Stage B P1B isolated partial ledger and conflict
on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u07/d5o2/stageb/p1b/**'
      - 'diagnosis-service/src/test/resources/u07/d5o2/stageb/p1b/**'
      - 'tools/u07_d5_o2_tx_topology/stageb/p1b/**'
      - '.github/workflows/u07-d5-o2-stage-b-p1b.yml'
permissions:
  contents: read
jobs:
  p1b-source-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-p1b-disposable-root
          MYSQL_DATABASE: u07_d5o2_stage_b_p1b
        ports:
          - 33329:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-p1b-disposable-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      U07_D5O2_P1B_PROFILE: U07_D5O2_STAGE_B_P1B_SYNTHETIC
      U07_D5O2_P1B_ISOLATED: 'true'
      U07_D5O2_P1B_URL: jdbc:mysql://127.0.0.1:33329/u07_d5o2_stage_b_p1b?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      U07_P1B_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify isolated runner and pin source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^2)" = "$U07_P1B_PR_HEAD_SHA"
          test "$U07_D5O2_P1B_PROFILE" = U07_D5O2_STAGE_B_P1B_SYNTHETIC
          test "$U07_D5O2_P1B_ISOLATED" = true
          test "$U07_D5O2_P1B_URL" = 'jdbc:mysql://127.0.0.1:33329/u07_d5o2_stage_b_p1b?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          java -version
      - name: Mint ephemeral DB identities and bootstrap pinned original schema
        shell: bash
        env:
          MYSQL_PWD: synthetic-p1b-disposable-root
        run: |
          set -euo pipefail
          for role in WRITER READER SEEDER; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf 'P1B_%s_PWD=%s\n' "$role" "$value" >> "$GITHUB_ENV"
            export "P1B_${role}_PWD=$value"
          done
          umask 077
          python3 tools/u07_d5_o2_tx_topology/stageb/p1b/bootstrap-and-verify.py bootstrap >/tmp/p1b-schema.sql
          mysql -h 127.0.0.1 -P 33329 -uroot u07_d5o2_stage_b_p1b </tmp/p1b-schema.sql
          rm -f /tmp/p1b-schema.sql
      - name: Compile shared Java bindings
        run: mvn -B -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Java8 test compile
        run: mvn -B -f diagnosis-service/pom.xml -DskipTests test-compile
      - name: Fifteen physical P1B partial and conflict tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f diagnosis-service/pom.xml -Dtest=StageBP1BPartialLedgerTest,StageBP1BReplayConflictTest test
          python3 tools/u07_d5_o2_tx_topology/stageb/p1b/bootstrap-and-verify.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: u07-d5-o2-stage-b-p1b-evidence
          path: |
            diagnosis-service/target/surefire-reports/TEST-*StageBP1B*.xml
            diagnosis-service/target/u07-d5o2-stage-b-p1b-evidence.json
