        run: |
          python3 sut/.github/verification/u05_rdp06/build_evidence.py             --evidence-root sut/diagnosis-service/target/u05-rdp06-evidence             --expectations sut/diagnosis-service/src/test/resources/u05/verification/u05-verification-expectations.json             --precedence-expectations sut/diagnosis-service/src/test/resources/u05/verification/u05-d03-precedence-expectations.json             --fixtures sut/diagnosis-service/src/test/resources/u05/verification/u05-verification-fixtures.json             --auth-profile sut/diagnosis-service/src/test/resources/u05/verification/u05-verification-auth-profile.json             --contract-manifest build/u05-rdp06/u05-contract-manifest.json             --structural-summary build/u05-rdp06/structural-guard-summary.json             --regression-summary build/u05-rdp06/regression-summary.json             --workflow-provenance build/u05-rdp06/workflow-provenance.txt             --focused-reports-dir sut/diagnosis-service/target/surefire-reports             --harness-report sut/diagnosis-service/target/surefire-reports/TEST-com.aidoctor.diagnosis.runtime.u05.verification.U05EvidenceHarnessVerificationTest.xml             --output-dir build/u05-rdp06/evidence

      - name: G9-G12 validate completeness, expected/observed equality and hard boundaries
        run: |
          python3 sut/.github/verification/u05_rdp06/validate_evidence.py             --bundle-dir build/u05-rdp06/evidence
          echo "U05-VG-005=PASS"

      - name: G13 display SHA-256 evidence checksums
