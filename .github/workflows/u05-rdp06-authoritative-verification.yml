          python3 .github/verification/u05_rdp06/build_contract_manifest.py             --repo-root .             --expectations diagnosis-service/src/test/resources/u05/verification/u05-verification-expectations.json             --precedence diagnosis-service/src/test/resources/u05/verification/u05-d03-precedence-expectations.json             --fixtures diagnosis-service/src/test/resources/u05/verification/u05-verification-fixtures.json             --output ../build/u05-rdp06/u05-contract-manifest.json

