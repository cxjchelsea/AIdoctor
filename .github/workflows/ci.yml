  ocr-runtime-engineering-docker-real-tool:
    name: ocr-runtime-engineering-docker-real-tool
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Record Docker identity
        run: |
          docker --version
          docker info --format '{{.ServerVersion}}'
      - name: Build dedicated engineering Runtime image
        run: |
          docker build \
            -f engineering/Dockerfile \
            -t aidoctor-engineering-runtime:postfreeze-03c \
            .
          echo "ENGINEERING_DOCKER_RUNTIME_IMAGE_BUILD=PASS"
      - name: Record engineering image identity
        run: |
          docker image inspect aidoctor-engineering-runtime:postfreeze-03c \
            --format 'Id={{.Id}} RepoTags={{json .RepoTags}} RepoDigests={{json .RepoDigests}} Size={{.Size}}'
      - name: Run container-internal localhost Runtime real-tool probe
        run: |
          docker run --rm \
            -e AIDOCTOR_ENGINEERING_RAW_OCR_PORT=8099 \
            aidoctor-engineering-runtime:postfreeze-03c \
            python engineering/docker_runtime_probe.py
