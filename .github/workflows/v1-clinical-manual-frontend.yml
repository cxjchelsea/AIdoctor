name: V1 Clinical Synthetic Manual Frontend Build
on:
  pull_request:
    paths:
      - 'frontend/src/pages/V1ClinicalManualTestPage.tsx'
      - 'frontend/src/App.tsx'
      - 'frontend/vite.config.ts'
      - '.github/workflows/v1-clinical-manual-frontend.yml'
  workflow_dispatch:
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
