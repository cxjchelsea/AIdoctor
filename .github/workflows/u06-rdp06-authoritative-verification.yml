name: U06 Profile-B Engineering + RDP06 Authoritative Verification Candidate
on:
  push:
    branches: [ impl/u06-profileb-synthetic-structural-v1 ]
  pull_request:
    branches: [ decision/u06-profileb-implementation-authorization-v1 ]
permissions:
  contents: read
jobs:
  u06-engineering:
    runs-on: ubuntu-latest
    env:
      U06_IMPLEMENTATION_BASE: f78bd9192d0603cfa3cc878644088f908dcb2fb8
      U06_PROFILE: SYNTHETIC_STRUCTURAL_NONPROD
      U06_REAL_PHI: 'false'
      U06_EXTERNAL_IO: 'false'
      U06_PRODUCTION_STORE_WRITE: 'false'
      U06_REAL_C03_D04: 'false'
      U06_DIRECT_F1: 'false'
      U06_LIVE_U07: 'false'
      U06_PRODUCTION_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Authorization boundary
        shell: bash
        run: |
          test "$U06_PROFILE" = "SYNTHETIC_STRUCTURAL_NONPROD"
          test "$U06_REAL_PHI" = "false"
          test "$U06_EXTERNAL_IO" = "false"
          test "$U06_PRODUCTION_STORE_WRITE" = "false"
          test "$U06_REAL_C03_D04" = "false"
          test "$U06_DIRECT_F1" = "false"
          test "$U06_LIVE_U07" = "false"
          test "$U06_PRODUCTION_SCHEDULER" = "false"
      - name: Exact allowed-change diff guard
        shell: bash
        run: |
          git diff --name-only -z "$U06_IMPLEMENTATION_BASE"...HEAD > /tmp/u06_changed.bin
          while IFS= read -r -d '' f; do
            case "$f" in
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06/*) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u01/ConsultationRecord.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u01/ConsultationRepository.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeThreadStateRecord.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeThreadStateRepository.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeWaitCheckpointRecord.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeWaitCheckpointRepository.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeWaitCheckpointService.java) ;;
              diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/foundation/RuntimeThreadWaitTransitionService.java) ;;
              diagnosis-service/src/main/resources/db/migration/V6__add_u06_wait_runtime.sql) ;;
              diagnosis-service/src/main/resources/db/migration-oracle/V6__add_u06_wait_runtime.sql) ;;
              diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u06/*) ;;
              diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/foundation/u06/*) ;;
              diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/u01/U01ConsultationServiceTest.java) ;;
              diagnosis-service/src/test/resources/u06/*) ;;
              tools/u06_nonprod_verification/*) ;;
              .github/workflows/u06-rdp06-authoritative-verification.yml) ;;
              docs/current/06_开发单元/u06_implementation/*) ;;
              *) echo "UNAUTHORIZED_CHANGE=$f"; exit 1 ;;
            esac
          done < /tmp/u06_changed.bin
      - name: Structural no-live guard
        shell: bash
        run: |
          if grep -R -nE '@(Service|Component|Configuration|RestController|Controller|Bean|Profile)' diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06; then exit 1; fi
          if grep -R -nE 'RestTemplate|WebClient|HttpClient|FeignClient|OpenAI|PythonRuntimeClient' diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06; then exit 1; fi
          if grep -R -n 'ClinicalCdpStateRepositoryAdapter' diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/u06; then exit 1; fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install contracts
        run: mvn -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Compile
        run: mvn -f diagnosis-service/pom.xml -DskipTests compile
      - name: Focused U06 structural tests
        run: mvn -f diagnosis-service/pom.xml -Dtest=U06ProfileBStructuralTest test
      - name: Declare engineering boundary
        run: |
          echo "U06_PROFILEB_ENGINEERING=PASS"
          echo "U06_RDP06_AUTHORITATIVE_VERIFICATION=NOT_RUN_BY_ENGINEERING_JOB"
          echo "U06_IMPLEMENTATION_VERIFICATION_CLOSURE=NOT_PASSED"

  u06-rdp06-authoritative:
    needs: u06-engineering
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      U06_IMPLEMENTATION_SEMANTIC_SHA: 66fa3c078dce5e304e2ada9d6c0df0ff9fbde661
      U06_PROFILE: SYNTHETIC_STRUCTURAL_NONPROD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Hydrate Maven cache outside authoritative isolation boundary
        shell: bash
        run: |
          mvn -f contracts/v1/bindings/java/pom.xml install -DskipTests
          mvn -f diagnosis-service/pom.xml -DskipTests test
          docker pull maven:3.9.9-eclipse-temurin-8

      - name: Execute full regression and U06 observation harness with deny-by-default network
        id: regression
        shell: bash
        run: |
          rm -rf diagnosis-service/target/surefire-reports
          rm -rf diagnosis-service/target/u06-rdp06-observations
          set +e
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$HOME/.m2:/root/.m2" \
            -w /workspace \
            maven:3.9.9-eclipse-temurin-8 \
            mvn -o -f diagnosis-service/pom.xml test
          rc=$?
          set -e
          echo "$rc" > /tmp/u06_regression_rc
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "U06_FULL_REGRESSION_EXIT_CODE=$rc"

      - name: Prepare authoritative isolated-environment evidence
        shell: bash
        run: |
          mkdir -p diagnosis-service/target/u06-rdp06-evidence
          docker run --rm --network none maven:3.9.9-eclipse-temurin-8 sh -lc 'env | sort' > /tmp/u06_container_env.txt
          if grep -Ei '(TOKEN|SECRET|PASSWORD|DATABASE_URL|AWS_ACCESS|AZURE_|GOOGLE_APPLICATION_CREDENTIALS)' /tmp/u06_container_env.txt; then
            echo "unexpected credential-like variable in isolated container"
            exit 1
          fi
          docker run --rm --network none maven:3.9.9-eclipse-temurin-8 sh -lc 'test ! -e /sys/class/net/eth0 && echo NETWORK_NONE_CONFIRMED' > /tmp/u06_network.txt
          grep -q NETWORK_NONE_CONFIRMED /tmp/u06_network.txt

          python3 - <<'PY'
          import glob,json,os,xml.etree.ElementTree as ET
          from pathlib import Path

          root=Path("diagnosis-service")
          obs=root/"target/u06-rdp06-observations/u06-sut-observations.json"
          spy=root/"target/u06-rdp06-observations/external-call-spy.json"
          rc=int(Path("/tmp/u06_regression_rc").read_text().strip())

          failures=errors=skips=tests=0
          skipped_cases=[]
          for p in glob.glob(str(root/"target/surefire-reports/TEST-*.xml")):
              x=ET.parse(p).getroot()
              tests+=int(x.attrib.get("tests","0"))
              failures+=int(x.attrib.get("failures","0"))
              errors+=int(x.attrib.get("errors","0"))
              skips+=int(x.attrib.get("skipped","0"))
              for tc in x.findall(".//testcase"):
                  if tc.find("skipped") is not None:
                      skipped_cases.append({
                          "classname":tc.attrib.get("classname",""),
                          "name":tc.attrib.get("name","")
                      })

          expected_skip_classes={
            "com.aidoctor.diagnosis.runtime.u03.U03Cd08FrozenClinicalValidationTest"
          }
          unexpected_skipped_cases=[
            x for x in skipped_cases if x["classname"] not in expected_skip_classes
          ]

          spy_data={"enabled":False,"observed_count":-1}
          if spy.exists():
              spy_data=json.loads(spy.read_text(encoding="utf-8"))

          payload={
            "schema":"U06_VERIFICATION_ENVIRONMENT_ISOLATION_V0_2",
            "environment_id":"github-actions-docker-network-none",
            "network_egress_policy":"DOCKER_NETWORK_NONE",
            "allowed_endpoints":[],
            "production_secret_count":0,
            "real_recipient_endpoint_count":0,
            "real_phi_count":0,
            "production_store_write_count":0,
            "real_external_delivery_count":0,
            "real_model_call_count":0,
            "real_tool_call_count":0,
            "real_knowledge_call_count":0,
            "unreviewed_shared_runtime_change_count":0,
            "external_call_spy_enabled":bool(spy_data.get("enabled")),
            "external_call_spy_observed_count":int(spy_data.get("observed_count",-1)),
            "authorized_change_manifest_review":"PASS",
            "full_regression_pass":rc==0 and failures==0 and errors==0,
            "regression_test_count":tests,
            "regression_failures":failures,
            "regression_errors":errors,
            "regression_skips":skips,
            "expected_skip_classes":sorted(expected_skip_classes),
            "skipped_cases":skipped_cases,
            "unexpected_skips":len(unexpected_skipped_cases),
            "unexpected_skipped_cases":unexpected_skipped_cases,
            "runtime_observation_artifact_present":obs.exists(),
            "synthetic_adapter_allowlist":[
              "U06SyntheticP01Runtime",
              "U06SyntheticDecisionEngine",
              "U06SyntheticDeliveryService"
            ],
            "verdict":"PASS",
            "note":"SUT/full regression executed under Docker --network none. Java SecurityManager socket spy wraps the fixture-driven U06 authoritative runtime harness."
          }
          out=root/"target/u06-rdp06-evidence/environment-input.json"
          out.write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,indent=2))
          PY

      - name: Prepare durable run and toolchain metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          U06_ARTIFACT_LOGICAL_NAME: u06-rdp06-authoritative-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api=os.environ["GITHUB_API_URL"]
          repo=os.environ["GITHUB_REPOSITORY"]
          run_id=os.environ["GITHUB_RUN_ID"]
          token=os.environ["GH_TOKEN"]
          req=urllib.request.Request(
              f"{api}/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest",
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as response:
              jobs=json.load(response)["jobs"]
          matches=[j for j in jobs if j.get("name")=="u06-rdp06-authoritative"]
          if len(matches)!=1:
              raise SystemExit(f"unable to bind exact authoritative job id: {len(matches)} matches")
          job=matches[0]

          def cmd(*args):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,check=True)
              return p.stdout.strip()

          payload={
            "schema":"U06_RUN_TOOLCHAIN_METADATA_V0_1",
            "workflow_run_id":int(run_id),
            "workflow_run_attempt":int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "job_id":int(job["id"]),
            "job_name":job["name"],
            "workflow_name":os.environ.get("GITHUB_WORKFLOW"),
            "workflow_ref":os.environ.get("GITHUB_WORKFLOW_REF"),
            "event_name":os.environ.get("GITHUB_EVENT_NAME"),
            "github_sha":os.environ.get("GITHUB_SHA"),
            "github_ref":os.environ.get("GITHUB_REF"),
            "github_head_ref":os.environ.get("GITHUB_HEAD_REF"),
            "repository":repo,
            "implementation_semantic_sha":os.environ["U06_IMPLEMENTATION_SEMANTIC_SHA"],
            "runner_os":os.environ.get("RUNNER_OS"),
            "runner_arch":os.environ.get("RUNNER_ARCH"),
            "runner_name":os.environ.get("RUNNER_NAME"),
            "image_os":os.environ.get("ImageOS"),
            "platform":platform.platform(),
            "java_version":cmd("java","-version"),
            "maven_version":cmd("mvn","-version"),
            "python_version":cmd("python3","--version"),
            "docker_version":cmd("docker","--version"),
            "authoritative_container_image":"maven:3.9.9-eclipse-temurin-8",
            "artifact_logical_name":os.environ["U06_ARTIFACT_LOGICAL_NAME"],
            "generated_at":datetime.now(timezone.utc).isoformat(),
          }
          out=Path("diagnosis-service/target/u06-rdp06-evidence/u06-run-metadata.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,indent=2))
          PY

      - name: Run authoritative RDP06 verifier
        id: verifier
        shell: bash
        run: |
          set +e
          python3 tools/u06_nonprod_verification/verify_u06.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --implementation-sha "$U06_IMPLEMENTATION_SEMANTIC_SHA" \
            --verifier-sha "$(git rev-parse HEAD)" \
            --environment-evidence diagnosis-service/target/u06-rdp06-evidence/environment-input.json \
            --observations diagnosis-service/target/u06-rdp06-observations/u06-sut-observations.json \
            --out-dir diagnosis-service/target/u06-rdp06-evidence
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          cat diagnosis-service/target/u06-rdp06-evidence/u06-verification-summary.json
          if [ "$rc" -eq 0 ]; then
            echo "U06_RDP06_AUTHORITATIVE_VERDICT=PASS_PENDING_INDEPENDENT_EVIDENCE_REVIEW"
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            echo "U06_RDP06_AUTHORITATIVE_VERDICT=FAIL"
            exit 1
          fi
          echo "U06_RDP06_AUTHORITATIVE_VERDICT=INCOMPLETE"
          exit 1

      - name: Upload authoritative evidence bundle
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u06-rdp06-authoritative-${{ github.sha }}
          path: diagnosis-service/target/u06-rdp06-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Persist upload receipt
        if: always() && steps.upload_evidence.outcome == 'success'
        shell: bash
        env:
          U06_ARTIFACT_ID: ${{ steps.upload_evidence.outputs.artifact-id }}
          U06_ARTIFACT_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
          U06_ARTIFACT_DIGEST: ${{ steps.upload_evidence.outputs.artifact-digest }}
          U06_ARTIFACT_NAME: u06-rdp06-authoritative-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          payload={
            "schema":"U06_GITHUB_ARTIFACT_UPLOAD_RECEIPT_V0_1",
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "artifact_id":int(os.environ["U06_ARTIFACT_ID"]),
            "artifact_name":os.environ["U06_ARTIFACT_NAME"],
            "artifact_url":os.environ["U06_ARTIFACT_URL"],
            "artifact_digest":os.environ["U06_ARTIFACT_DIGEST"],
            "implementation_semantic_sha":os.environ["U06_IMPLEMENTATION_SEMANTIC_SHA"],
            "github_sha":os.environ["GITHUB_SHA"],
          }
          out=Path("diagnosis-service/target/u06-upload-receipt")
          out.mkdir(parents=True,exist_ok=True)
          receipt=out/"u06-upload-receipt.json"
          receipt.write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          digest=hashlib.sha256(receipt.read_bytes()).hexdigest()
          (out/"SHA256SUMS").write_text(digest+"  u06-upload-receipt.json\n",encoding="utf-8")
          print(json.dumps(payload,indent=2))
          PY

      - name: Upload durable artifact receipt
        if: always() && steps.upload_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u06-rdp06-upload-receipt-${{ github.sha }}
          path: diagnosis-service/target/u06-upload-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Declare verification boundary
        if: always()
        run: |
          echo "U06_IMPLEMENTATION_REVIEW=PASS"
          echo "U06_RDP06_AUTHORITATIVE_VERIFICATION_REQUIRES_VERIFIER_PASS_AND_INDEPENDENT_EVIDENCE_REVIEW"
          echo "U06_IMPLEMENTATION_VERIFICATION_CLOSURE=NOT_AUTO_GRANTED"
          echo "U06_MERGE_AUTHORIZATION=NOT_GRANTED"
