name: Foundation-1 Verification

on:
  push:
    branches:
      - impl/foundation-1-governance-binding-trace
  pull_request:
    branches:
      - main
    paths:
      - 'diagnosis-service/src/main/java/com/aidoctor/diagnosis/runtime/governance/**'
      - 'diagnosis-service/src/test/java/com/aidoctor/diagnosis/runtime/governance/**'
      - 'diagnosis-service/src/main/resources/db/migration/**'
      - 'diagnosis-service/src/main/resources/db/migration-oracle/**'
      - '.github/workflows/foundation-1-verification.yml'

permissions:
  contents: read

jobs:
  java-governance-foundation:
    name: java-governance-foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install Shared Contracts v1 Java binding
        run: mvn -f contracts/v1/bindings/java/pom.xml install -DskipTests
      - name: Compile diagnosis-service
        run: mvn -f diagnosis-service/pom.xml -DskipTests compile
      - name: Run Foundation-1 focused tests
        run: >-
          mvn -f diagnosis-service/pom.xml
          -Dtest='Foundation1GovernanceTest,FoundationRuntimeBaseTest,U01SemanticPolicyTest,U01ConsultationServiceTest'
          test
      - name: Run diagnosis-service regression suite
        run: mvn -f diagnosis-service/pom.xml test
