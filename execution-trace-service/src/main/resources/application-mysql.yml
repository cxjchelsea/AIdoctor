spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aidoctor_trace?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      # 连接池配置（性能优化）
      minimum-idle: 5           # 最小空闲连接数
      maximum-pool-size: 15      # 最大连接数（从10增加到15）
      connection-timeout: 30000   # 连接超时（毫秒）
      idle-timeout: 600000       # 空闲连接超时（10分钟）
      max-lifetime: 1800000      # 连接最大生存时间（30分钟）
      leak-detection-threshold: 60000 # 连接泄漏检测阈值


