server:
  port: 8093 # 独立追踪服务端口

spring:
  application:
    name: execution-trace-service
  profiles:
    # 主开发环境: dev (Oracle - 公司部署)
    # 可选本地测试: mysql (MySQL - 本地快速测试，可选)
    active: dev
  jpa:
    hibernate:
      ddl-auto: none # 禁用Hibernate自动建表，使用Flyway管理
    show-sql: false  # 关闭SQL日志输出（生产环境建议关闭，调试时可设为true）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false  # 关闭SQL格式化（配合show-sql: false）
        use_sql_comments: false  # 关闭SQL注释（配合show-sql: false）
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial baseline for execution trace"
    validate-on-migrate: true
    check-location: true
    clean-disabled: true

# 执行追踪配置
execution:
  trace:
    enabled: true
    async:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 1000
    data-retention-days: 30 # 数据保留天数
    auto-create-database: true # 自动创建数据库（如果不存在）

# Actuator配置（性能监控）
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,info
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: mysql

# 日志配置
logging:
  level:
    root: INFO
    com.aidoctor.trace: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: WARN  # Hibernate SQL日志级别设为WARN（关闭SQL输出）
    org.hibernate.type.descriptor.sql.BasicBinder: WARN  # Hibernate参数绑定日志级别设为WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%file:%line] - %msg%n"
  file:
    name: logs/app.log
    max-size: 10MB
    max-history: 5
    total-size-cap: 50MB

# CDP更新URL (用于回调diagnosis-service更新CDP摘要)
trace:
  cdp-update-url: http://localhost:8084/api/v1/cdp/update-trace-summary


