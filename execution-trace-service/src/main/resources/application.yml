server:
  port: 8093 # 独立追踪服务端口

spring:
  application:
    name: execution-trace-service
  profiles:
    active: mysql  # 激活mysql配置
  jpa:
    hibernate:
      ddl-auto: none # 禁用Hibernate自动建表，使用Flyway管理
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial baseline for execution trace"
    validate-on-migrate: true
    check-location: true
    clean-disabled: true

# 执行追踪配置
execution:
  trace:
    enabled: true
    async:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 1000
    data-retention-days: 30 # 数据保留天数
    auto-create-database: true # 自动创建数据库（如果不存在）

# 日志配置
logging:
  level:
    root: INFO
    com.aidoctor.trace: DEBUG
    org.flywaydb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CDP更新URL (用于回调diagnosis-service更新CDP摘要)
trace:
  cdp-update-url: http://localhost:8084/api/v1/cdp/update-trace-summary


