server:
  port: 8084

spring:
  # 修复Springfox与Spring Boot 2.7的兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  # 本地调试使用MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aidoctor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      # 连接池配置（性能优化）
      minimum-idle: 5           # 最小空闲连接数
      maximum-pool-size: 20      # 最大连接数（从10增加到20）
      connection-timeout: 30000   # 连接超时（毫秒）
      idle-timeout: 600000       # 空闲连接超时（10分钟）
      max-lifetime: 1800000      # 连接最大生存时间（30分钟）
      leak-detection-threshold: 60000 # 连接泄漏检测阈值
  
  jpa:
    hibernate:
      ddl-auto: none  # 禁用Hibernate自动建表，使用Flyway管理
    show-sql: false  # 关闭SQL日志输出（生产环境建议关闭，调试时可设为true）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false  # 关闭SQL格式化（配合show-sql: false）
        use_sql_comments: false  # 关闭SQL注释（配合show-sql: false）
    open-in-view: false
  
  # Flyway数据库迁移配置（MySQL版本）
  flyway:
    enabled: true
    locations: classpath:db/migration  # MySQL脚本目录（Oracle脚本在独立的migration-oracle目录中）
    baseline-on-migrate: true  # 如果数据库已有表，标记为已迁移
    baseline-version: 0
    baseline-description: "初始基线"
    validate-on-migrate: true  # 验证迁移脚本
    # 确保Flyway在Hibernate之前执行
    check-location: true  # 检查迁移脚本位置
    clean-disabled: true  # 禁用clean操作（生产环境安全）
  
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        # Redis连接池配置（性能优化）
        max-active: 20    # 最大连接数（从8增加到20）
        max-idle: 10      # 最大空闲连接数
        min-idle: 5       # 最小空闲连接数
        max-wait: 2000    # 最大等待时间（毫秒）

  # Nacos配置（本地调试可以禁用）
  cloud:
    nacos:
      discovery:
        enabled: false  # 本地调试可以禁用Nacos
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: DEFAULT_GROUP

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 2000  # 连接超时2秒（服务不可用时快速失败）
        readTimeout: 5000      # 读取超时5秒
        loggerLevel: basic
  # 启用容错处理
  hystrix:
    enabled: false  # 如果不需要 Hystrix，保持 false
  # 或者使用 Resilience4j（如果项目中有）

# 诊断引擎服务地址
diagnosis:
  engine:
    service-url: http://localhost:8086
  ocr:
    service-url: http://localhost:8087

# 健康状态判定服务地址
health-state-assessment:
  service-url: http://localhost:8081  # health-state-assessment-service 运行在 8081 端口

# 病例理解服务地址
clinical-parsing:
  service-url: http://localhost:8082  # clinical-parsing-service 运行在 8082 端口

# 对话服务地址
dialog:
  service-url: http://localhost:8088

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: 智能诊断系统API文档
    description: 智能诊断系统的REST API接口文档
    version: 1.0.0

# 执行追踪配置
execution:
  trace:
    enabled: true  # 是否启用追踪（管理端功能，生产环境可关闭）

# 追踪服务地址
trace:
  service-url: http://localhost:8093  # execution-trace-service 运行在 8093 端口

# 日志配置
logging:
  level:
    root: INFO
    com.aidoctor.diagnosis: DEBUG
    org.flywaydb: DEBUG  # Flyway详细日志
    org.flywaydb.core.internal: DEBUG  # Flyway核心日志
    org.hibernate.SQL: WARN  # Hibernate SQL日志级别设为WARN（关闭SQL输出）
    org.hibernate.type.descriptor.sql.BasicBinder: WARN  # Hibernate参数绑定日志级别设为WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

