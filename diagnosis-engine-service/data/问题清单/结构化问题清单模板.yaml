# ============================================
# 结构化问题清单模板
# ============================================
# 对应知识内容：4. 结构化问题清单模板
# 存储位置：诊断引擎服务/数据/问题清单/
# 说明：定义系统在问诊时需要问哪些问题，以及问题的优先级

元数据:
  配置名称: 结构化问题清单模板
  版本号: v1.0
  更新时间: 2026-02-03
  说明: "定义问诊问题的模板，包括主要问题、伴随问题、关键背景等"

# ============================================
# 问题清单结构定义
# ============================================
问题清单结构定义:
  主要问题:
    说明: "针对主诉本身的问题，用于了解主诉的详细信息"
    优先级: "必填"
    包含字段:
      - "主诉名称"
      - "起病时间与过程"
      - "部位/范围"
      - "分布"
      - "性质"
      - "严重程度"
      - "诱因"
      - "缓解因素"
    数据来源: "主诉关键字段配置（chief_complaint_key_fields.yaml）"
  
  伴随问题:
    说明: "与主诉同时出现的其他症状，用于辅助诊断"
    优先级: "重要"
    包含字段:
      - "伴随症状列表"
      - "症状关系（同时/先后）"
      - "症状严重程度"
    数据来源: "主诉配置 + 知识图谱（主诉包含的症状关系）"
  
  关键背景:
    说明: "关键背景信息，诊断错误常源于信息采集偏差，必须纳入"
    优先级: "必填/重要"
    包含字段:
      - "年龄"
      - "性别"
      - "既往史（疾病史、手术史、过敏史）"
      - "用药史（当前用药、既往用药）"
      - "家族史（遗传疾病史）"
      - "妊娠状态（如适用）"
      - "暴露史（职业、环境等）"
    数据来源: "基础标准配置（人群字段标准）"
  
  生命体征:
    说明: "主动询问或设备采集的生命体征数据"
    优先级: "必填/重要"
    包含字段:
      - "血压（收缩压、舒张压）"
      - "心率"
      - "体温"
      - "呼吸频率"
      - "血氧饱和度（如适用）"
    数据来源: "基础标准配置（生命体征正常范围）"
  
  信息缺口:
    必填缺口:
      说明: "缺失则不能继续诊断的信息"
      处理: "必须补齐"
      示例:
        - "起病时间"
        - "严重程度"
        - "年龄"
        - "性别"
        - "生命体征（如适用）"
    
    重要缺口:
      说明: "缺失会影响诊断准确性的信息"
      处理: "可继续但降级"
      示例:
        - "症状性质"
        - "伴随症状"
        - "既往史"
        - "用药史"
    
    可选缺口:
      说明: "可以后续补充的信息"
      处理: "可后续补充"
      示例:
        - "家族史"
        - "暴露史"
        - "详细用药史"

# ============================================
# 主诉问题模板
# ============================================
# 说明：针对不同主诉的问题模板
# 注意：具体问题内容从主诉关键字段配置（chief_complaint_key_fields.yaml）中获取
# 这里定义通用的问题模板结构和示例

主诉问题模板:
  # 胸痛主诉
  - 主诉ID: "CC_CHEST_PAIN"
    主诉名称: "胸痛"
    主要问题:
      - 问题ID: "Q_CHEST_PAIN_001"
        字段ID: "KF_起病时间与过程"
        问题内容: "什么时候开始的？突然还是慢慢加重？"
        字段名: "起病时间与过程"
        优先级: "必须"
        答案类型: "复合"
        答案格式:
          类型: "复合"
          选项:
            - "突然"
            - "渐进"
            - "不确定"
          时间单位: "天/小时"
        标准问法: "症状是什么时候开始的？突然还是慢慢加重？"
        缺失处理: "必须补齐"
      
      - 问题ID: "Q_CHEST_PAIN_002"
        字段ID: "KF_部位范围"
        问题内容: "具体哪里不舒服？是一点还是一片？"
        字段名: "部位范围"
        优先级: "必须"
        答案类型: "多选"
        答案格式:
          类型: "多选"
          选项来源: "知识图谱_标准部位"
          选项:
            - "胸骨后"
            - "心前区"
            - "左侧胸部"
            - "右侧胸部"
            - "全胸"
            - "不确定"
        标准问法: "具体哪里不舒服？是一点还是一片？"
        缺失处理: "必须补齐"
      
      - 问题ID: "Q_CHEST_PAIN_003"
        字段ID: "KF_性质"
        问题内容: "更像刺痛、压着、灼烧还是闷胀？"
        字段名: "性质"
        优先级: "必须"
        答案类型: "单选"
        答案格式:
          类型: "单选"
          选项来源: "知识图谱_症状性质"
          选项:
            - "刺痛"
            - "压迫感"
            - "烧灼感"
            - "闷胀"
            - "不确定"
          允许不确定: true
        标准问法: "更像刺痛、压着、灼烧还是闷胀？"
        缺失处理: "必须补齐"
      
      - 问题ID: "Q_CHEST_PAIN_004"
        字段ID: "KF_严重度"
        问题内容: "0到10分你给几分？"
        字段名: "严重程度"
        优先级: "必须"
        答案类型: "数值"
        答案格式:
          类型: "数值"
          范围: [0, 10]
          允许不确定: true
        标准问法: "0到10分你给几分？"
        缺失处理: "必须补齐"
      
      - 问题ID: "Q_CHEST_PAIN_005"
        字段ID: "KF_诱因"
        问题内容: "什么情况下出现或加重？"
        字段名: "诱因"
        优先级: "重要"
        答案类型: "多选"
        答案格式:
          类型: "多选"
