# ============================================
# 问题优先级规则
# ============================================
问题优先级规则:
  优先级定义:
    必须:
      说明: "缺失则不能继续诊断的信息"
      处理方式: "必须补齐"
      示例:
        - "起病时间"
        - "严重程度"
        - "年龄"
        - "性别"
      询问顺序: 1
    
    重要:
      说明: "缺失会影响诊断准确性的信息"
      处理方式: "可继续但降级"
      示例:
        - "症状性质"
        - "伴随症状"
        - "既往史"
        - "用药史"
      询问顺序: 2
    
    可选:
      说明: "可以后续补充的信息"
      处理方式: "可后续补充"
      示例:
        - "家族史"
        - "暴露史"
      询问顺序: 3
  
  询问策略:
    顺序策略: "按优先级顺序询问，必须字段优先"
    批量询问: "同一优先级的问题可以批量询问"
    动态调整: "根据已收集信息动态调整后续问题"
    跳过规则: "如果信息已从其他来源获取，可以跳过"

# ============================================
# 问题生成规则
# ============================================
问题生成规则:
  问题来源:
    - "主诉关键字段配置（chief_complaint_key_fields.yaml）"
    - "主诉问题模板（本文件）"
    - "知识图谱（主诉包含的症状关系）"
    - "基础标准配置（人群字段标准、生命体征正常范围）"
  
  问题生成流程:
    步骤1: "根据识别的主诉，加载主诉问题模板"
    步骤2: "从主诉关键字段配置获取关键字段问题"
    步骤3: "从知识图谱获取伴随症状问题"
    步骤4: "加载通用关键背景问题模板"
    步骤5: "按优先级排序所有问题"
    步骤6: "生成问题清单"
  
  问题个性化:
    根据主诉: "不同主诉有不同的问题模板"
    根据人群: "根据年龄、性别等调整问题"
    根据场景: "根据适用场景（全科/急诊等）调整问题"

# ============================================
# 使用说明
# ============================================
使用说明:
  配置文件关联:
    - "本配置文件定义问题清单的结构和模板"
    - "具体主诉的问题内容从主诉关键字段配置（chief_complaint_key_fields.yaml）中获取"
    - "伴随症状问题从知识图谱中获取（主诉包含的症状关系）"
    - "关键背景问题从基础标准配置中获取"
  
  系统调用流程:
    步骤1: "用户输入症状，系统识别主诉"
    步骤2: "根据主诉ID加载主诉问题模板"
    步骤3: "从主诉关键字段配置加载关键字段问题"
    步骤4: "从知识图谱查询伴随症状，生成伴随问题"
    步骤5: "加载通用关键背景问题模板"
    步骤6: "按优先级排序，生成完整问题清单"
    步骤7: "按顺序询问问题，收集信息"
  
  问题清单更新:
    - "主诉问题模板：在主诉问题模板中新增主诉"
    - "伴随问题模板：在伴随问题模板中新增症状类型"
    - "关键背景问题模板：在关键背景问题模板中新增字段"
    - "所有更新后需要更新版本号和更新时间"








