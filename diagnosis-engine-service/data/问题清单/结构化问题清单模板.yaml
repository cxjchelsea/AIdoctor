            - "运动"
            - "进食"
            - "体位"
            - "情绪"
            - "外伤"
            - "不确定"
        标准问法: "什么情况下出现或加重？"
        缺失处理: "可继续但降级"
      
      - 问题ID: "Q_CHEST_PAIN_006"
        字段ID: "KF_缓解因素"
        问题内容: "休息或用药后会缓解吗？"
