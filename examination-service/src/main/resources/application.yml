spring:
  profiles:
    # 主开发环境: dev (Oracle - 公司部署)
    # 可选本地测试: mysql (MySQL - 本地快速测试，可选)
    active: dev
  application:
    name: examination-service

# Actuator配置（性能监控）
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,info
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: mysql

